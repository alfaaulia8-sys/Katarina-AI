name: One-time prune of merged KATARINA audit branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-audit-branch-20261011.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  remove-confirmed-merged-ref:
    if: github.repository == 'alfaauliau-katarinaAI/Katarina-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact PR, SHA and merged status before branch deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "alfaauliau-katarinaAI/Katarina-AI"
          branch = "audit/path-mt5-integration-20261011"
          expected = "43ddc248b3bd914e416825a752e9c6957187e8a1"
          base = "https://api.github.com/repos/" + repository
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, allow_missing=False):
              req = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise RuntimeError("GitHub API " + method + " failed HTTP " + str(error.code)) from error

          pr = request("GET", "/pulls/23")
          assert pr["merged"] is True, "Refuse to delete an unmerged branch"
          assert pr["head"]["ref"] == branch, "Pull request head moved to another branch"
          assert pr["head"]["sha"] == expected, "Pull request SHA differs"
          encoded = urllib.parse.quote(branch, safe="/")
          ref = request("GET", "/git/ref/heads/" + encoded, allow_missing=True)
          if ref is None:
              print("ALREADY_PRUNED: no live audit branch remains")
          else:
              assert ref["object"]["sha"] == expected, "Branch changed; refuse deletion"
              request("DELETE", "/git/refs/heads/" + encoded)
              assert request("GET", "/git/ref/heads/" + encoded, allow_missing=True) is None
              print("PRUNED_MERGED_BRANCH: confirmed exact ref deleted")
          PY
