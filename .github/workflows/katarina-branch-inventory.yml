name: Katarina Branch Inventory (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify retained and obsolete branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/governance/audit_branch_inventory.py
      - name: Upload branch inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-branch-inventory-${{ github.run_id }}
          path: build/validation/branch-inventory.json
          if-no-files-found: error
          retention-days: 30
