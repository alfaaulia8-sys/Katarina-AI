name: Stage 07 ZeroMQ Capability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage07-zmq-capability.yml"
      - "mt5/Tests/KatarinaStage07ZmqCapability.mq5"
      - "mt5/Include/Katarina/Stage07/**"
      - "protocol/golden/kat1_v1_vectors.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  MQL5_ZMQ_REPO: coke5151/mql5-zmq
  MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
  KAT_ZMQ_ENDPOINT: tcp://127.0.0.1:5567

jobs:
  zmq-capability:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python ZeroMQ capability dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyzmq
          python -c "import zmq; print('pyzmq=' + zmq.__version__ + ' libzmq=' + zmq.zmq_version())"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Zmq"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage ZeroMQ binding DLLs and Katarina spike
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Katarina\Stage07" | Out-Null
          New-Item -ItemType Directory -Force -Path $libraries | Out-Null
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null

          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Include\Katarina\Stage07\*.mqh" "$include\Katarina\Stage07\" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07ZmqCapability.mq5" "$scripts\KatarinaStage07ZmqCapability.mq5" -Force

          foreach ($name in @("libzmq.dll","libsodium.dll")) {
            $p = Join-Path $libraries $name
            if (!(Test-Path $p)) { throw "$name missing from MT5 Libraries." }
            Write-Host "$name SHA256=$((Get-FileHash $p -Algorithm SHA256).Hash)"
          }

      - name: Strict compile ZeroMQ capability spike
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07ZmqCapability.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07ZmqCapability.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07ZmqCapability.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "MetaEditor compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "ZeroMQ capability spike compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "ZeroMQ capability EX5 missing." }
          if ((Get-Item $artifact).Length -le 0) { throw "ZeroMQ capability EX5 is empty." }

          "STAGE07_ZMQ_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write Python ROUTER raw-KAT1 echo server
        shell: pwsh
        run: |
          @'
          import json
          import os
          import pathlib
          import time
          import zmq

          endpoint = os.environ["KAT_ZMQ_ENDPOINT"]
          ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-zmq-ready.txt"
          result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-zmq-router-result.json"

          ctx = zmq.Context.instance()
          sock = ctx.socket(zmq.ROUTER)
          sock.linger = 0
          sock.bind(endpoint)
          ready.write_text(endpoint, encoding="utf-8")

          poller = zmq.Poller()
          poller.register(sock, zmq.POLLIN)
          deadline = time.monotonic() + 15.0
          payload = None
          route = None

          while time.monotonic() < deadline:
              events = dict(poller.poll(100))
              if sock not in events:
                  continue
              parts = sock.recv_multipart()
              if len(parts) != 2:
                  raise RuntimeError(f"expected ROUTER identity+payload, got {len(parts)} parts")
              route, payload = parts
              if len(payload) != 104:
                  raise RuntimeError(f"expected 104 raw KAT1 bytes, got {len(payload)}")
              if payload[:4] != b"KAT1":
                  raise RuntimeError("raw payload does not start with KAT1 magic")
              sock.send_multipart([route, payload])

              # Do not close immediately with linger=0. Wait until MT5 proves
              # it received the echo by sending the same KAT1 frame back.
              ack_deadline = time.monotonic() + 8.0
              ack = None
              while time.monotonic() < ack_deadline:
                  ack_events = dict(poller.poll(100))
                  if sock not in ack_events:
                      continue
                  ack_parts = sock.recv_multipart()
                  if len(ack_parts) != 2:
                      raise RuntimeError(
                          f"expected ACK identity+payload, got {len(ack_parts)} parts"
                      )
                  ack_route, ack = ack_parts
                  if ack_route != route:
                      raise RuntimeError("MT5 ACK route identity changed")
                  if ack != payload:
                      raise RuntimeError("MT5 ACK payload differs from echoed KAT1 frame")
                  break

              if ack is None:
                  raise RuntimeError("timed out waiting for MT5 echo ACK")
              break

          if payload is None:
              raise RuntimeError("timed out waiting for MT5 DEALER KAT1 frame")

          result.write_text(json.dumps({
              "result": "PASS",
              "endpoint": endpoint,
              "payload_bytes": len(payload),
              "ack_bytes": len(ack),
              "magic": payload[:4].decode("ascii"),
              "route_bytes": len(route),
              "pyzmq": zmq.__version__,
              "libzmq": zmq.zmq_version(),
          }, indent=2), encoding="utf-8")
          sock.close(0)
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_zmq_router.py" -Encoding UTF8

      - name: Run MT5 DEALER to Python ROUTER capability roundtrip
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-zmq-ready.txt"
          $routerResult = "$env:RUNNER_TEMP\kat-zmq-router-result.json"
          Remove-Item $ready,$routerResult -Force -ErrorAction SilentlyContinue

          $router = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_zmq_router.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($router.HasExited) { throw "Python ROUTER exited before becoming ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python ROUTER did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_zmq_capability_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-zmq-capability.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07ZmqCapability
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $router.WaitForExit(15000) | Out-Null
          if (-not $router.HasExited) {
            Stop-Process -Id $router.Id -Force
            throw "Python ROUTER did not terminate after roundtrip."
          }
          if ($router.ExitCode -ne 0) { throw "Python ROUTER failed with exit code $($router.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 ZeroMQ capability evidence missing." }
          if (!(Test-Path $routerResult)) { throw "Python ROUTER evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }

          Get-Content $mt5Evidence | Write-Host
          Get-Content $routerResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "MT5 ZeroMQ capability result is not PASS." }
          if ($values["proof_type"] -ne "MQL5_ZEROMQ_CAPABILITY") { throw "Unexpected MT5 proof type." }
          if ($values["raw_kat1_bytes"] -ne "104") { throw "Unexpected raw KAT1 byte count." }
          if ($values["dlls_allowed"] -ne "1") { throw "MT5 did not run with DLL imports enabled for spike." }

          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_zmq_capability_result.txt" -Force
          Copy-Item $routerResult ".\build\stage07\stage07_zmq_router_result.json" -Force

      - name: Write ZeroMQ capability evidence
        shell: pwsh
        run: |
          $router = Get-Content ".\build\stage07\stage07_zmq_router_result.json" -Raw | ConvertFrom-Json
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            dependency_repo = "$env:MQL5_ZMQ_REPO"
            dependency_commit = "$env:MQL5_ZMQ_COMMIT"
            endpoint = "$env:KAT_ZMQ_ENDPOINT"
            topology = "PYTHON_ROUTER_MT5_DEALER"
            raw_kat1_bytes = [int]$router.payload_bytes
            pyzmq = [string]$router.pyzmq
            libzmq_python = [string]$router.libzmq
            mt5_ex5_sha256 = "$env:STAGE07_ZMQ_EX5_SHA256"
            compile = "PASS_0_ERRORS_0_WARNINGS"
            dll_load = "PASS"
            dealer_router_roundtrip = "PASS"
            nonblocking_mql_send_receive = "PASS"
            json_application_wrapper = $false
            result = "PASS_STAGE07_ZEROMQ_CAPABILITY_SPIKE"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_zmq_capability_evidence.json" -Encoding UTF8

      - name: Upload ZeroMQ capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage07-zmq-capability-evidence
          path: |
            build/stage07/KatarinaStage07ZmqCapability.compile.log
            build/stage07/Katarina_Stage07_zmq_capability_result.txt
            build/stage07/stage07_zmq_router_result.json
            build/stage07/stage07_zmq_capability_evidence.json
          retention-days: 30
