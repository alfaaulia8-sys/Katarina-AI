name: KATARINA Six-Role Parallel Build Team

# Manual-only: four concurrent reviewers, then QA, then manager.
# No VPS, automatic commits, self-hosted runner, external AI impersonation or trades.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-six-role-team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specialists:
    name: ${{ matrix.role }} specialist
    strategy:
      fail-fast: false
      matrix:
        role: [ideas, coding, math, logic]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute independent ${{ matrix.role }} review
        run: python scripts/ai/katarina_team.py "${{ matrix.role }}" --commit "${{ github.sha }}"
      - name: Publish signed role receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-team-${{ matrix.role }}
          path: build/team/roles/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

  qa:
    name: QA independent acceptance
    needs: specialists
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all four independently written receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          pattern: katarina-team-*
          path: build/team/roles
          merge-multiple: true
      - name: Install core project regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Full unit, static and integration regression
        id: regression
        continue-on-error: true
        run: |
          python -m unittest discover -s tests/unit -p 'test_*.py' -q
          python -m unittest discover -s tests/static -p 'test_*.py' -q
          python -m unittest discover -s tests/integration -p 'test_*.py' -q
      - name: Validate receipts and create QA report
        if: always()
        env:
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          STATUS=fail
          if [ "$REGRESSION" = success ]; then STATUS=pass; fi
          python scripts/ai/katarina_team.py qa --commit "${{ github.sha }}" --regression "$STATUS"
      - name: Publish independent QA receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-team-qa
          path: build/team/roles/qa.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail CI for broken regressions
        if: steps.regression.outcome != 'success'
        run: exit 1

  manager:
    name: Manager scope and release gate
    needs: [specialists, qa]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all specialist and QA evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          pattern: katarina-team-*
          path: build/team/roles
          merge-multiple: true
      - name: Manager independently verifies handoffs and sets priority
        run: python scripts/ai/katarina_team.py manager --commit "${{ github.sha }}"
      - name: Write visible management status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          f=Path('build/team/roles/manager.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as out:
              if not f.exists():
                  out.write('## Katarina team BLOCKED: no valid manager handoff\n')
              else:
                  r=json.loads(f.read_text())
                  out.write('## Katarina parallel team\n')
                  out.write('Engineering: **{}**; V1 release: **{}**\n\n'.format(
                      r['engineering_status'],r['v1_release_status']))
                  out.write('| Role | Status |\n|---|---|\n')
                  for name,status in r['specialist_status'].items():
                      out.write('| {} | {} |\n'.format(name,status))
                  out.write('| QA | {} |\n'.format(r['qa_result']))
                  out.write('\nNext: **{}**. Live trading: OFF.\n'.format(
                      r['next_priority']))
          PY
      - name: Upload reproducible manager decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-team-manager-${{ github.run_id }}
          path: build/team/roles/
          if-no-files-found: warn
          retention-days: 7
