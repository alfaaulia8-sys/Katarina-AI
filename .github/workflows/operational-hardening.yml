name: KATARINA Operational Hardening

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile Python
        run: python -m compileall -q src
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
