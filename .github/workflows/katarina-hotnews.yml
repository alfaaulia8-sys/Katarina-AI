name: KATARINA verified news backup (free build budget)
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: katarina-market-news
  cancel-in-progress: false
jobs:
  refresh-sourced-headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh headline snapshot only when fresh trusted RSS changes
        run: python scripts/update_hot_news.py --output website/hot-news.json
      - name: Store sourced news for reviewed publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: sourced-market-news-${{ github.run_id }}
          path: website/hot-news.json
          if-no-files-found: error
          retention-days: 7
