name: Stage 07 Native Account Record

# Manual native integration smoke only; Body CI owns push checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-account-record:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07NativeAccount"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Start-Sleep -Seconds 3
          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }
          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }
          if (-not $resolved) { throw "MetaTrader installation files not found." }
          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage MQL5 sources
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"
          New-Item -ItemType Directory -Force -Path $include,$scripts | Out-Null
          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07NativeAccountRecordTest.mq5" "$scripts\KatarinaStage07NativeAccountRecordTest.mq5" -Force

      - name: Strict compile native account record test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07NativeAccountRecordTest.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07NativeAccountRecordTest.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07NativeAccountRecordTest.compile.log"

          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null
          if (!(Test-Path $log)) { throw "Compile log missing." }
          $text = Get-Content $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") { throw "Compile is not 0/0." }
          if (!(Test-Path $artifact)) { throw "EX5 missing." }

      - name: Run MQL5 native account record test
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $evidence = Join-Path $commonFiles "Katarina_Stage07_native_account_record_result.txt"
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-native-account.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage07NativeAccountRecordTest
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $p = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($p.ExitCode)"
          if (!(Test-Path $evidence)) { throw "MQL evidence missing." }
          Get-Content $evidence | Write-Host
          if ((Get-Content $evidence -Raw) -notmatch "result=PASS") { throw "MQL account record builder failed." }
          Copy-Item $evidence ".\build\stage07\Katarina_Stage07_native_account_record_result.txt" -Force

      - name: Verify 144-byte body against Python KAT1 codec
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog

          evidence = root / "build" / "stage07" / "Katarina_Stage07_native_account_record_result.txt"
          values = {}
          for line in evidence.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key] = value

          actual = bytes.fromhex(values["body_hex"])
          if len(actual) != 144:
              raise RuntimeError(f"MQL body length expected 144, got {len(actual)}")

          server = b"Katarina-CI"
          material = (
              b"KAT1/account-id/v1"
              + b"\x00"
              + len(server).to_bytes(4, "little")
              + server
              + b"\x00"
              + b"123456"
          )
          account_id = hashlib.sha256(material).digest()[:16]

          codec = Kat1Codec(
              SchemaCatalog.from_path(root / "protocol" / "kat1_message_schemas_v1.json")
          )
          frame = codec.encode(
              message_type=200,
              schema_version=1,
              sequence=1,
              source_time_ns=1,
              stream_id=77,
              boot_id=88,
              values={
                  "account_id": account_id,
                  "account_revision": 55,
                  "presence_flags": 0xFFFF,
                  "balance_units": 100000,
                  "equity_units": 98766,
                  "credit_units": 0,
                  "profit_units": -1234,
                  "margin_units": 5000,
                  "free_margin_units": 93766,
                  "margin_initial_units": 0,
                  "margin_maintenance_units": 0,
                  "leverage": 500,
                  "margin_level_e6": 1975320000,
                  "margin_call_e6": 50000000,
                  "stopout_e6": 20000000,
                  "account_mode": 1,
                  "trade_mode": 3,
                  "stopout_mode_raw": 0,
                  "account_currency_digits": 2,
                  "account_flags": 7,
                  "account_unit_profile_revision": 9,
              },
          )
          decoded = codec.decode(frame)
          expected = decoded.payload[:decoded.header.block_length]

          if actual != expected:
              for i, (a, b) in enumerate(zip(actual, expected)):
                  if a != b:
                      raise RuntimeError(
                          f"native ACCOUNT_STATE byte mismatch at offset {i}: "
                          f"mql={a:02x} python={b:02x}"
                      )
              raise RuntimeError("native ACCOUNT_STATE body mismatch")

          out = root / "build" / "stage07" / "stage07_native_account_record_evidence.json"
          out.write_text(
              json.dumps(
                  {
                      "schema_version": "1.0",
                      "stage": "07",
                      "record_type": "ACCOUNT_STATE",
                      "body_bytes": 144,
                      "cross_language_byte_equality": "PASS",
                      "money_scale": 2,
                      "negative_money_roundtrip": "PASS",
                      "result": "PASS_STAGE07_NATIVE_ACCOUNT_RECORD",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print("Stage-07 native ACCOUNT_STATE MQL/Python body equality PASS")
          '@ | python

      - name: Upload native account record evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-native-account-record-evidence
          path: |
            build/stage07/KatarinaStage07NativeAccountRecordTest.compile.log
            build/stage07/Katarina_Stage07_native_account_record_result.txt
            build/stage07/stage07_native_account_record_evidence.json
          retention-days: 30
