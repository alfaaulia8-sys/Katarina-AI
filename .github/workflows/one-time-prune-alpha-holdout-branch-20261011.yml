name: One-time prune merged alpha provenance branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-prune-alpha-holdout-branch-20261011.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'alfaauliau-katarinaAI/Katarina-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact merged and unchanged research ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          base="https://api.github.com/repos/alfaauliau-katarinaAI/Katarina-AI"
          branch="research/alpha-holdout-provenance-20261011"
          sha="23a5c734df9f79fee76531e9f0009546367f77d4"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def call(method,path,missing=False):
              req=urllib.request.Request(base+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read()
                      return json.loads(data) if data else {}
              except urllib.error.HTTPError as e:
                  if missing and e.code==404: return None
                  raise
          pr=call("GET","/pulls/28")
          assert pr["merged"] is True
          assert pr["head"]["ref"]==branch and pr["head"]["sha"]==sha
          url="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          ref=call("GET",url,True)
          if ref is not None:
              assert ref["object"]["sha"]==sha, "Ref moved; do not delete"
              call("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          assert call("GET",url,True) is None
          print("PASS_MERGED_ALPHA_PROVENANCE_BRANCH_PRUNED")
          PY
