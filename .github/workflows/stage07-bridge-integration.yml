name: Stage 07 Bridge Transport Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage07-bridge-integration.yml"
      - "requirements-stage07.txt"
      - "mt5/Experts/KatarinaBridgeStage07EA.mq5"
      - "mt5/Include/Katarina/**"
      - "mt5/Tests/KatarinaStage07BridgeTransportIntegration.mq5"
      - "src/katarina/adapters/transport/**"
      - "src/katarina/ports/transport.py"
      - "protocol/kat1_message_schemas_v1.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  MQL5_ZMQ_REPO: coke5151/mql5-zmq
  MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
  KAT_BRIDGE_ENDPOINT: tcp://127.0.0.1:5569

jobs:
  bridge-integration:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Bridge"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage Katarina and ZeroMQ MQL5 files
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $experts = "$env:MT5_HOME\MQL5\Experts"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path $include,$libraries,$experts,$scripts | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null

          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Experts\KatarinaBridgeStage07EA.mq5" "$experts\KatarinaBridgeStage07EA.mq5" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07BridgeTransportIntegration.mq5" "$scripts\KatarinaStage07BridgeTransportIntegration.mq5" -Force

      - name: Strict compile Stage-07 Bridge EA
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Experts\KatarinaBridgeStage07EA.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Experts\KatarinaBridgeStage07EA.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaBridgeStage07EA.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Bridge EA compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Stage-07 Bridge EA compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Stage-07 Bridge EA EX5 missing." }

          "STAGE07_BRIDGE_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Strict compile concrete Bridge transport test
        shell: powershell
        run: |
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07BridgeTransportIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07BridgeTransportIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07BridgeTransportIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Bridge transport compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Concrete Bridge transport compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Bridge transport test EX5 missing." }

      - name: Write Python Stage-07 session peer
        shell: pwsh
        run: |
          @'
          import asyncio
          import hashlib
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.session import Kat1SessionSupervisor, SessionState
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          def account_id(server: str, login: int) -> str:
              raw = server.encode("utf-8")
              material = (
                  b"KAT1/account-id/v1"
                  + b"\x00"
                  + len(raw).to_bytes(4, "little")
                  + raw
                  + b"\x00"
                  + str(login).encode("ascii")
              )
              return hashlib.sha256(material).digest()[:16].hex()

          async def main():
              endpoint = os.environ["KAT_BRIDGE_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-bridge-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-bridge-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              session = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xA7" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              session.start()
              ready.write_text(endpoint, encoding="utf-8")

              presence = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              hello = session.observe(presence, now_ns=1_000_000_000)
              if hello is None or session.state is not SessionState.HELLO_SENT:
                  raise RuntimeError("Stage-07 Bridge presence did not produce HELLO")
              await router.send_frame(hello.frame, peer=hello.peer)

              ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(ack, now_ns=1_100_000_000)

              if session.state is not SessionState.RECOVERING:
                  raise RuntimeError(f"Bridge did not end RECOVERING: {session.state}")
              if session.communication_ready or session.live_risk_ready:
                  raise RuntimeError("Bridge handshake illegally granted readiness")

              binding = session.binding
              if binding is None:
                  raise RuntimeError("Bridge HELLO_ACK did not create binding")
              if binding.stream_id != 77 or binding.boot_id != 88:
                  raise RuntimeError("Bridge stream/boot binding mismatch")
              if binding.broker_login != 123456 or binding.broker_server != "Katarina-CI":
                  raise RuntimeError("Bridge broker binding mismatch")

              expected_id = account_id("Katarina-CI", 123456)
              if binding.account_id != expected_id:
                  raise RuntimeError(
                      f"Bridge account_id mismatch expected={expected_id} actual={binding.account_id}"
                  )

              result.write_text(json.dumps({
                  "result": "PASS",
                  "state": session.state.value,
                  "communication_ready": session.communication_ready,
                  "live_risk_ready": session.live_risk_ready,
                  "stream_id": binding.stream_id,
                  "boot_id": binding.boot_id,
                  "account_id": binding.account_id,
                  "broker_login": binding.broker_login,
                  "broker_server": binding.broker_server,
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_bridge_peer.py" -Encoding UTF8

      - name: Run concrete Bridge transport handshake
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-bridge-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-bridge-python-result.json"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $peer = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_bridge_peer.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($peer.HasExited) { throw "Python Bridge peer exited before ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python Bridge peer did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_bridge_transport_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-bridge-transport.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07BridgeTransportIntegration
          Symbol=EURUSD
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $peer.WaitForExit(15000) | Out-Null
          if (-not $peer.HasExited) {
            Stop-Process -Id $peer.Id -Force
            throw "Python Bridge peer did not terminate."
          }
          if ($peer.ExitCode -ne 0) { throw "Python Bridge peer failed with exit code $($peer.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 Bridge transport evidence missing." }
          if (!(Test-Path $pythonResult)) { throw "Python Bridge evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }
          $python = Get-Content $pythonResult -Raw | ConvertFrom-Json

          Get-Content $mt5Evidence | Write-Host
          Get-Content $pythonResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "Concrete Bridge transport did not pass." }
          if ($values["communication_ready"] -ne "0") { throw "Bridge transport incorrectly marked communication ready." }
          if ($values["live_risk_ready"] -ne "0") { throw "Bridge transport incorrectly marked live risk ready." }
          if ($python.state -ne "recovering") { throw "Python session is not RECOVERING." }
          if ($python.communication_ready -ne $false -or $python.live_risk_ready -ne $false) {
            throw "Python peer reports illegal readiness."
          }

          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_bridge_transport_result.txt" -Force
          Copy-Item $pythonResult ".\build\stage07\stage07_bridge_python_result.json" -Force

      - name: Write Bridge integration evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            bridge_ea = "KatarinaBridgeStage07EA"
            bridge_ex5_sha256 = "$env:STAGE07_BRIDGE_EX5_SHA256"
            transport = "ZEROMQ_DEALER"
            python_peer = "ZEROMQ_ROUTER"
            account_id_contract = "PASS_CROSS_LANGUAGE_SHA256"
            handshake = "PASS_HEARTBEAT_HELLO_HELLO_ACK"
            final_state = "RECOVERING"
            communication_ready = $false
            live_risk_ready = $false
            stage06_source_modified = $false
            result = "PASS_STAGE07_CONCRETE_BRIDGE_TRANSPORT"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_bridge_integration_evidence.json" -Encoding UTF8

      - name: Upload Bridge integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage07-bridge-integration-evidence
          path: |
            build/stage07/KatarinaBridgeStage07EA.compile.log
            build/stage07/KatarinaStage07BridgeTransportIntegration.compile.log
            build/stage07/Katarina_Stage07_bridge_transport_result.txt
            build/stage07/stage07_bridge_python_result.json
            build/stage07/stage07_bridge_integration_evidence.json
          retention-days: 30
