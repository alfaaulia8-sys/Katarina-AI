name: KATARINA Contextual Decision Intelligence Safety

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contextual-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal KATARINA test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile isolated decision intelligence
        run: |
          python -m py_compile src/katarina/intelligence/contextual_decision_intelligence.py
          python -m py_compile src/katarina/intelligence/market_decision_brain_v3.py
      - name: Verify causal context, hard blockers and real outcomes
        run: PYTHONPATH=src python -m unittest tests.unit.intelligence.test_contextual_decision_intelligence -v
      - name: Verify no new live-order path
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('src/katarina/intelligence/contextual_decision_intelligence.py').read_text()
          for banned in ('MetaTrader5', 'order_send(', 'order_check(', 'account_info(',
                         'trade_allowed = True', 'history_deals_get(', 'requests.get('):
              assert banned not in code,banned
          assert 'independently_forward_observed' in code
          assert 'resolved_at_utc' in code
          assert 'live_execution_authorized: bool = False' in code
          assert 'production_risk_fraction: float = 0.0' in code
          assert 'PAPER_OBSERVATION_ONLY' in code
          print('CAUSAL_BROKER_SAFE_CONTEXT_ENGINE_PASS')
          PY
