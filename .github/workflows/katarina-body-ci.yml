name: KATARINA Body CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/katarina-body-ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'mt5/**'
      - 'protocol/**'
      - 'ops/**'
      - 'functions/**'
      - 'oauth_gateway/**'
      - 'vps_bridge/**'
      - 'research/**'
      - 'models/**'
      - 'requirements*.txt'
      - 'KATARINA_CONSTITUTION.md'
  pull_request:
    paths:
      - '.github/workflows/katarina-body-ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'mt5/**'
      - 'protocol/**'
      - 'ops/**'
      - 'functions/**'
      - 'oauth_gateway/**'
      - 'vps_bridge/**'
      - 'research/**'
      - 'models/**'
      - 'requirements*.txt'
      - 'KATARINA_CONSTITUTION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-body-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  body:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 and NumPy research test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Compile Python
        run: python -m compileall -q src

      - name: Verify Python, MQL5, JSON, and website local dependencies
        run: python scripts/governance/audit_dependency_links.py --repo-root . --output build/validation/dependency-links.json

      - name: Unit regression
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Static regression
        run: PYTHONPATH=src python -m unittest discover -s tests/static -p 'test_*.py' -v

      - name: Integration regression
        run: PYTHONPATH=src python -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Private alpha evidence remains blocked without uploaded broker sources
        run: |
          PYTHONPATH=src python scripts/research/audit_private_alpha_holdout.py --repo-root . --output build/validation/private-alpha-holdout.json
          python - <<'PY'
          import json
          report=json.load(open('build/validation/private-alpha-holdout.json'))
          assert report['result']=='BLOCKED_PRIVATE_INPUT_FILES_NOT_PROVIDED'
          assert not report['shadow_research_qualified']
          assert not report['live_execution_authorized']
          print('PASS_PRIVATE_ALPHA_CANNOT_PROMOTE_WITHOUT_EVIDENCE')
          PY

      - name: Pre-registered 7-market regime alpha program (research-only)
        run: PYTHONPATH=src python scripts/governance/audit_alpha_regime_program.py --repo-root . --output build/validation/alpha-regime-program.json

      - name: Stage 14/15 research evidence honesty audit
        run: PYTHONPATH=src python scripts/governance/audit_stage14_15_research.py --repo-root . --output build/validation/stage14-15-research-honesty.json

      - name: Stage 16/17 synthetic cost and margin gates
        run: PYTHONPATH=src python scripts/governance/audit_stage16_17_synthetic.py --repo-root . --output build/validation/stage16-17-synthetic.json

      - name: Stage 10 local audit
        run: |
          PYTHONPATH=src python scripts/stage10/audit_stage10_final.py --repo-root . --output build/stage10/stage10_local_final_clearance.json

      - name: Constitution Guard
        run: |
          PYTHONPATH=src python scripts/governance/audit_constitution_guard.py --repo-root . --output build/governance/constitution_guard.json

      - name: Stage 11-40 framework audit
        run: |
          PYTHONPATH=src python scripts/body/audit_body_framework.py --repo-root . --output build/body/body_framework_audit.json

      - name: Stage 11-40 functional audit
        run: |
          PYTHONPATH=src python scripts/body/audit_functional_body.py --repo-root . --output build/body/katarina_body_local_clearance.json

      - name: Block automatic self-hosted VPS workflows
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("katarina-vps-lab.yml", "katarina-vps-low-memory-rescue.yml"):
              text = (Path(".github/workflows") / name).read_text(encoding="utf-8")
              trigger_section = text.split("permissions:", 1)[0]
              assert re.search(r"(?m)^  workflow_dispatch:\s*$", trigger_section), name
              assert not re.search(r"(?m)^  push:\s*$", trigger_section), name
              assert "if: github.ref == 'refs/heads/main'" in text, name
          print("PASS_VPS_MANUAL_ONLY")
          PY

      - name: Repository hygiene guard
        run: python scripts/governance/audit_repo_hygiene.py --repo-root . --output build/repository-hygiene.json

      - name: Verify fail-closed evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expectations = {
              "build/stage10/stage10_local_final_clearance.json": "PASS_STAGE10_LOCAL_FINAL_CLEARANCE",
              "build/governance/constitution_guard.json": "PASS_KATARINA_CONSTITUTION_GUARD",
              "build/body/body_framework_audit.json": "PASS_KATARINA_BODY_FRAMEWORK_11_40",
              "build/body/katarina_body_local_clearance.json": "PASS_KATARINA_BODY_LOCAL_10_40",
          }
          for path, result in expectations.items():
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              assert payload["result"] == result, (path, payload.get("result"))
              assert payload["live_risk_ready"] is False, path
              assert payload.get("live_execution_enabled", False) is False, path
          print("PASS_GITHUB_FIRST_GATE: audited and live risk remains disabled")
          PY

      - name: Upload GitHub CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katarina-body-gate-${{ github.run_id }}
          path: |
            build/stage10/stage10_local_final_clearance.json
            build/governance/constitution_guard.json
            build/body/body_framework_audit.json
            build/body/katarina_body_local_clearance.json
            build/repository-hygiene.json
            build/validation/dependency-links.json
            build/validation/stage14-15-research-honesty.json
            build/validation/alpha-regime-program.json
            build/validation/private-alpha-holdout.json
            build/validation/stage16-17-synthetic.json
          if-no-files-found: warn
          retention-days: 30
