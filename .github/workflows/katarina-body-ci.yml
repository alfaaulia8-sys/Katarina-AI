name: KATARINA Body CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'website/hot-news.json'
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'website/hot-news.json'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-body-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  body:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 and NumPy research test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Compile Python
        run: python -m compileall -q src

      - name: Verify Python, MQL5, JSON, and website local dependencies
        run: python scripts/governance/audit_dependency_links.py --repo-root . --output build/validation/dependency-links.json

      - name: Unit regression
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Static regression
        run: PYTHONPATH=src python -m unittest discover -s tests/static -p 'test_*.py' -v

      - name: Integration regression
        run: PYTHONPATH=src python -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Offline autonomous observer and virtual decision proof (synthetic)
        run: PYTHONPATH=src python scripts/ai/audit_autonomous_shadow.py --output build/validation/autonomous-shadow-safety.json

      - name: Private alpha evidence remains blocked without uploaded broker sources
        run: |
          PYTHONPATH=src python scripts/research/audit_private_alpha_holdout.py --repo-root . --output build/validation/private-alpha-holdout.json
          python - <<'PY'
          import json
          report=json.load(open('build/validation/private-alpha-holdout.json'))
          assert report['result']=='BLOCKED_PRIVATE_INPUT_FILES_NOT_PROVIDED'
          assert not report['shadow_research_qualified']
          assert not report['live_execution_authorized']
          print('PASS_PRIVATE_ALPHA_CANNOT_PROMOTE_WITHOUT_EVIDENCE')
          PY

      - name: Pre-registered 7-market regime alpha program (research-only)
        run: PYTHONPATH=src python scripts/governance/audit_alpha_regime_program.py --repo-root . --output build/validation/alpha-regime-program.json

      - name: Stage 14/15 research evidence honesty audit
        run: PYTHONPATH=src python scripts/governance/audit_stage14_15_research.py --repo-root . --output build/validation/stage14-15-research-honesty.json

      - name: Stage 16/17 synthetic cost and margin gates
        run: PYTHONPATH=src python scripts/governance/audit_stage16_17_synthetic.py --repo-root . --output build/validation/stage16-17-synthetic.json

      - name: Stage 10 local audit
        run: |
          PYTHONPATH=src python scripts/stage10/audit_stage10_final.py --repo-root . --output build/stage10/stage10_local_final_clearance.json

      - name: Constitution Guard
        run: |
          PYTHONPATH=src python scripts/governance/audit_constitution_guard.py --repo-root . --output build/governance/constitution_guard.json

      - name: Stage 11-40 framework audit
        run: |
          PYTHONPATH=src python scripts/body/audit_body_framework.py --repo-root . --output build/body/body_framework_audit.json

      - name: Stage 11-40 functional audit
        run: |
          PYTHONPATH=src python scripts/body/audit_functional_body.py --repo-root . --output build/body/katarina_body_local_clearance.json

      - name: Block automatic self-hosted VPS workflows
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("katarina-vps-lab.yml", "katarina-vps-low-memory-rescue.yml"):
              text = (Path(".github/workflows") / name).read_text(encoding="utf-8")
              trigger_section = text.split("permissions:", 1)[0]
              assert re.search(r"(?m)^  workflow_dispatch:\s*$", trigger_section), name
              assert not re.search(r"(?m)^  push:\s*$", trigger_section), name
              assert "if: github.ref == 'refs/heads/main'" in text, name
          print("PASS_VPS_MANUAL_ONLY")
          PY

      - name: Repository hygiene guard
        run: python scripts/governance/audit_repo_hygiene.py --repo-root . --output build/repository-hygiene.json

      - name: Verify fail-closed evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expectations = {
              "build/stage10/stage10_local_final_clearance.json": "PASS_STAGE10_LOCAL_FINAL_CLEARANCE",
              "build/governance/constitution_guard.json": "PASS_KATARINA_CONSTITUTION_GUARD",
              "build/body/body_framework_audit.json": "PASS_KATARINA_BODY_FRAMEWORK_11_40",
              "build/body/katarina_body_local_clearance.json": "PASS_KATARINA_BODY_LOCAL_10_40",
          }
          for path, result in expectations.items():
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              assert payload["result"] == result, (path, payload.get("result"))
              assert payload["live_risk_ready"] is False, path
              assert payload.get("live_execution_enabled", False) is False, path
          print("PASS_GITHUB_FIRST_GATE: audited and live risk remains disabled")
          PY

      - name: Upload GitHub CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katarina-body-gate-${{ github.run_id }}
          path: |
            build/stage10/stage10_local_final_clearance.json
            build/governance/constitution_guard.json
            build/body/body_framework_audit.json
            build/body/katarina_body_local_clearance.json
            build/repository-hygiene.json
            build/validation/dependency-links.json
            build/validation/stage14-15-research-honesty.json
            build/validation/alpha-regime-program.json
            build/validation/private-alpha-holdout.json
            build/validation/autonomous-shadow-safety.json
            build/validation/stage16-17-synthetic.json
          if-no-files-found: warn
          retention-days: 30

  ai-model-connection-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ai-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: External author A
        id: ai_a
        uses: actions/ai-inference@v2.0.8
        with:
          model: openai/gpt-4.1-mini
          max-tokens: 250
          system-prompt: 'You are a cautious quant critic. Output only valid JSON. Never authorize code changes or trading.'
          prompt: |
            This is a FABRICATED offline example: 240 fictional observations
            on 30 dates and 36 later fictional holdout observations with
            positive simulated expectancy. No real broker fills.
            Is it worth more offline study? Return only JSON with
            verdict (APPROVE_RESEARCH, REJECT or ABSTAIN),
            rationale (short string), and
            evidence_references (list with cohorts.0.holdout).
      - name: External author B
        id: ai_b
        uses: actions/ai-inference@v2.0.8
        with:
          model: meta/Meta-Llama-3.1-8B-Instruct
          max-tokens: 250
          system-prompt: 'You are a cautious quant critic. Output only valid JSON. Never authorize code changes or trading.'
          prompt: |
            This is a FABRICATED offline example: 240 fictional observations
            on 30 dates and 36 later fictional holdout observations with
            positive simulated expectancy. No real broker fills.
            Is it worth more offline study? Return only JSON with
            verdict (APPROVE_RESEARCH, REJECT or ABSTAIN),
            rationale (short string), and
            evidence_references (list with cohorts.0.holdout).
      - name: Verify independent model responses with immutable Katarina research gate
        env:
          AI_A_FILE: ${{ steps.ai_a.outputs.response-file }}
          AI_B_FILE: ${{ steps.ai_b.outputs.response-file }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.ai.audit_self_evolution_runner import AS_OF,simulated_history
          from katarina.intelligence.self_evolution_lab import evaluate_shadow_self_evolution
          from katarina.governance.external_model_bridge import verdict_from_text
          from katarina.governance.multi_model_evolution_review import review_candidate
          db=simulated_history(days=30,strong_net_r=2.,weak_net_r=-1.)
          try:
              report=evaluate_shadow_self_evolution(db,as_of_utc=AS_OF)
          finally:
              db.close()
          receipt=report['review_receipt_sha256']
          a=verdict_from_text(Path(os.environ['AI_A_FILE']).read_text(),model='openai/gpt-4.1-mini',receipt=receipt)
          b=verdict_from_text(Path(os.environ['AI_B_FILE']).read_text(),model='meta/Meta-Llama-3.1-8B-Instruct',receipt=receipt)
          x=review_candidate(report,(a,b))
          assert x.independent_providers==2
          assert not x.real_execution_authorized
          assert not x.code_mutation_authorized
          data={'models_called':2,'authors':['openai','meta'],'verdicts':[a.verdict,b.verdict],
                'research_decision':x.status,'live_trading_authorized':False,
                'self_modification_authorized':False,'synthetic_only':True}
          out=Path('build/validation/github-external-ai-synthetic.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(data,indent=2)+'\n')
          print('PASS_EXTERNAL_AI_CONNECTED_RESEARCH_ONLY')
          PY
      - name: Save safe model connection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-ai-smoke-${{ github.run_id }}
          path: build/validation/github-external-ai-synthetic.json
          if-no-files-found: warn
          retention-days: 7

  discovery-one-time-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[strategy-discovery-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Causal evolution unit regressions
        run: |
          python -m unittest discover -s tests/unit/intelligence -p test_autonomous_strategy_discovery.py -v
      - name: Search invented rules on synthetic offline OHLC
        run: |
          python scripts/research/run_autonomous_strategy_discovery.py --synthetic \
            --population 16 --generations 3 --seed 77 \
            --output build/discovery/candidates.json \
            --summary build/discovery/SUMMARY.md
      - name: Verify research-only evidence and untouched holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/discovery/candidates.json').read_text())
          assert d['data_origin']=='SYNTHETIC_FABRICATED_HOURLY_FIXTURE'
          assert d['candidate_trials']>0
          assert d['held_out_was_used_in_selection'] is False
          assert d['model_promotion_permitted'] is False
          assert d['code_rewrite_permitted'] is False
          assert d['live_execution_authorized'] is False
          assert d['production_action']=='WAIT' and d['orders_sent']==0
          print('PASS_EVOLUTIONARY_STRATEGY_DISCOVERY_GITHUB_RUNNER')
          PY
      - name: Save strategy research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-${{ github.run_id }}
          path: build/discovery/
          if-no-files-found: warn
          retention-days: 7

  team-specialists-one-time:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[team-smoke]')
    name: ${{ matrix.role }} team specialist
    strategy:
      fail-fast: false
      matrix:
        role: [ideas, coding, math, logic]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent specialist
        run: python scripts/ai/katarina_team.py "${{ matrix.role }}" --commit "${{ github.sha }}"
      - name: Upload evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: team-smoke-${{ matrix.role }}
          path: build/team/roles/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

  team-qa-one-time:
    if: always() && contains(github.event.head_commit.message, '[team-smoke]')
    needs: team-specialists-one-time
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: team-smoke-*
          path: build/team/roles
          merge-multiple: true
      - name: Install regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Test unit static and integration
        id: regression
        continue-on-error: true
        run: |
          python -m unittest discover -s tests/unit -p 'test_*.py' -q
          python -m unittest discover -s tests/static -p 'test_*.py' -q
          python -m unittest discover -s tests/integration -p 'test_*.py' -q
      - name: Independent QA receipt
        if: always()
        env:
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          STATE=fail
          if [ "$REGRESSION" = success ]; then STATE=pass; fi
          python scripts/ai/katarina_team.py qa --commit "${{ github.sha }}" --regression "$STATE"
      - name: Upload QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-smoke-qa
          path: build/team/roles/qa.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce regression pass
        if: steps.regression.outcome != 'success'
        run: exit 1

  team-manager-one-time:
    if: always() && contains(github.event.head_commit.message, '[team-smoke]')
    needs: [team-specialists-one-time, team-qa-one-time]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: team-smoke-*
          path: build/team/roles
          merge-multiple: true
      - name: Manager verifies QA and decides next priority
        run: |
          python scripts/ai/katarina_team.py manager --commit "${{ github.sha }}"
          python - <<'PY'
          import json
          d=json.load(open('build/team/roles/manager.json'))
          assert d['engineering_status']=='PASS',d['qa_result']
          assert d['v1_release_status']=='BLOCKED_UNTIL_ALL_ROADMAP_GATES_PASS'
          assert d['live_execution_authorized'] is False
          print('PASS_SIX_ROLE_PARALLEL_HANDOFF_RESEARCH_ONLY')
          PY
      - name: Upload manager report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-smoke-manager-${{ github.run_id }}
          path: build/team/roles/
          if-no-files-found: warn
          retention-days: 7

  v2-team-scheduler-smoke:
    name: Scheduler V2 smoke
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[team-v2-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ai/katarina_flow_v2.py scheduler --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v2-smoke-schedule
          path: build/team-v2/schedule.json
          if-no-files-found: error
          retention-days: 7

  v2-team-specialists-smoke:
    name: V2 ${{ matrix.role }} specialist
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[team-v2-smoke]')
    needs: v2-team-scheduler-smoke
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: [ideas, coding, math, logic, builder, debugger, runner_ops, data, ai_integration, infrastructure, security]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v2-smoke-schedule
          path: build/team-v2
      - run: python scripts/ai/katarina_flow_v2.py role --role "${{ matrix.role }}" --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v2-smoke-${{ matrix.role }}
          path: build/team-v2/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

  v2-team-qa-smoke:
    name: V2 QA verifies all 11
    if: always() && contains(github.event.head_commit.message, '[team-v2-smoke]')
    needs: [v2-team-scheduler-smoke, v2-team-specialists-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-smoke-*
          path: build/team-v2
          merge-multiple: true
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Run full QA regression
        id: regression
        continue-on-error: true
        run: |
          python -m unittest discover -s tests/unit -p 'test_*.py' -q
          python -m unittest discover -s tests/static -p 'test_*.py' -q
          python -m unittest discover -s tests/integration -p 'test_*.py' -q
      - name: Audit receipts and publish QA verdict
        if: always()
        env:
          RESULT: ${{ steps.regression.outcome }}
        run: |
          STATE=fail
          if [ "$RESULT" = success ]; then STATE=pass; fi
          python scripts/ai/katarina_flow_v2.py qa --commit "${{ github.sha }}" --regression "$STATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smoke-qa
          path: build/team-v2/qa.json
          if-no-files-found: warn
          retention-days: 7
      - name: Block regression failure
        if: steps.regression.outcome != 'success'
        run: exit 1

  v2-team-manager-smoke:
    name: V2 Manager independent handoff
    if: always() && contains(github.event.head_commit.message, '[team-v2-smoke]')
    needs: [v2-team-scheduler-smoke, v2-team-specialists-smoke, v2-team-qa-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-smoke-*
          path: build/team-v2
          merge-multiple: true
      - run: python scripts/ai/katarina_flow_v2.py manager --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smoke-manager
          path: build/team-v2/manager.json
          if-no-files-found: warn
          retention-days: 7

  v2-team-release-smoke:
    name: V2 Release risk gate
    if: always() && contains(github.event.head_commit.message, '[team-v2-smoke]')
    needs: [v2-team-scheduler-smoke, v2-team-specialists-smoke, v2-team-qa-smoke, v2-team-manager-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-smoke-*
          path: build/team-v2
          merge-multiple: true
      - name: Check safe release verdict
        run: |
          python scripts/ai/katarina_flow_v2.py release --commit "${{ github.sha }}"
          python - <<'PY'
          import json
          d=json.load(open('build/team-v2/release.json'))
          assert d['build_team_status']=='PASS'
          assert d['v1_release_status']=='BLOCKED'
          assert not d['live_execution_enabled']
          assert not d['release_candidate_promoted']
          assert d['orders_sent']==0
          print('PASS_TEAM_V2_ALL_ROLES_AUDITED_RELEASE_STILL_BLOCKED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smoke-release-${{ github.run_id }}
          path: build/team-v2/
          if-no-files-found: warn
          retention-days: 7
