name: Stage 35 Tester Safety
on:
  pull_request:
    paths:
      - 'scripts/stage35/**'
      - 'tests/static/test_stage35*'
      - 'tests/fixtures/stage35/**'
      - '.github/workflows/stage35-tester-safety.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage35/**'
      - 'tests/static/test_stage35*'
      - 'tests/fixtures/stage35/**'
      - '.github/workflows/stage35-tester-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-behavior:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse runner with Windows PowerShell
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/scripts/stage35/Run-KatarinaStage35Tester.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test runner with simulated terminal
        shell: pwsh
        run: python -m unittest discover -s tests/static -p 'test_stage35*.py' -v
