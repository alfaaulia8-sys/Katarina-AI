name: Katarina VPS Low-Memory Rescue

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/vps/rescue/*.trigger"

permissions:
  contents: read

jobs:
  rescue:
    runs-on: [self-hosted, windows, x64, katarina-vps]
    timeout-minutes: 10
    steps:
      - name: Collapse control plane to primary lane
        shell: cmd
        run: |
          @echo off
          echo [KATARINA] LOW_MEMORY_RESCUE_START

          echo [1/6] Disable supervisor guard
          schtasks.exe /Change /TN "KatarinaControlSupervisorGuard" /DISABLE >nul 2>&1
          schtasks.exe /End /TN "KatarinaControlSupervisorGuard" >nul 2>&1

          echo [2/6] Disable supervisor
          schtasks.exe /Change /TN "KatarinaControlSupervisor" /DISABLE >nul 2>&1
          schtasks.exe /End /TN "KatarinaControlSupervisor" >nul 2>&1

          echo [3/6] Disable recovery lane
          schtasks.exe /Change /TN "KatarinaControlRecovery" /DISABLE >nul 2>&1
          schtasks.exe /End /TN "KatarinaControlRecovery" >nul 2>&1

          echo [4/6] Disable worker lanes
          schtasks.exe /Change /TN "KatarinaControlWorker01" /DISABLE >nul 2>&1
          schtasks.exe /End /TN "KatarinaControlWorker01" >nul 2>&1
          schtasks.exe /Change /TN "KatarinaControlWorker02" /DISABLE >nul 2>&1
          schtasks.exe /End /TN "KatarinaControlWorker02" >nul 2>&1

          echo [5/6] Keep primary and watchdog enabled
          schtasks.exe /Change /TN "KatarinaVPSAgent" /ENABLE >nul 2>&1
          schtasks.exe /Change /TN "KatarinaVPSAgentWatchdog" /ENABLE >nul 2>&1
          schtasks.exe /End /TN "KatarinaVPSAgent" >nul 2>&1
          timeout /t 2 /nobreak >nul
          schtasks.exe /Run /TN "KatarinaVPSAgent"
          timeout /t 5 /nobreak >nul

          echo [6/6] Diagnostics
          echo --- Memory ---
          wmic OS get FreePhysicalMemory^,TotalVisibleMemorySize /Value
          echo --- PowerShell processes ---
          tasklist /FI "IMAGENAME eq powershell.exe"
          echo --- Primary task ---
          schtasks.exe /Query /TN "KatarinaVPSAgent" /FO LIST /V
          echo --- Watchdog task ---
          schtasks.exe /Query /TN "KatarinaVPSAgentWatchdog" /FO LIST /V
          echo [KATARINA] LOW_MEMORY_RESCUE_PASS
