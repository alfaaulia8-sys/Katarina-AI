name: Stage 07 MQL5 KAT1 Codec

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage07-mql5-codec.yml"
      - "mt5/Include/Katarina/Stage07/**"
      - "mt5/Tests/KatarinaStage07Kat1CodecTest.mq5"
      - "protocol/golden/kat1_v1_vectors.json"
      - "protocol/kat1_message_schemas_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mql5-kat1-codec:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )

          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Include\Katarina\Stage07" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Scripts" | Out-Null

      - name: Stage Stage-07 MQL files
        shell: pwsh
        run: |
          Copy-Item ".\mt5\Include\Katarina\Stage07\*.mqh" "$env:MT5_HOME\MQL5\Include\Katarina\Stage07\" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07Kat1CodecTest.mq5" "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07Kat1CodecTest.mq5" -Force

      - name: Strict MetaEditor compile
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07Kat1CodecTest.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07Kat1CodecTest.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07Kat1CodecTest.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "MetaEditor compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Stage-07 MQL5 codec compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Stage-07 codec EX5 missing." }
          if ((Get-Item $artifact).Length -le 0) { throw "Stage-07 codec EX5 is empty." }

          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash
          "STAGE07_EX5_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run 13 golden vectors headless
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $evidence = Join-Path $commonFiles "Katarina_Stage07_kat1_codec_result.txt"
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-kat1-codec.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage07Kat1CodecTest
          Symbol=EURUSD
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $p = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($p.ExitCode)"

          if (!(Test-Path $evidence)) { throw "Stage-07 MQL5 codec runtime evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }

          if ($values["stage"] -ne "07") { throw "Unexpected Stage-07 evidence stage." }
          if ($values["proof_type"] -ne "MQL5_KAT1_GOLDEN_CONFORMANCE") { throw "Unexpected proof type." }
          if ($values["vectors"] -ne "13") { throw "Expected 13 golden vectors." }
          if ($values["failures"] -ne "0") { throw "MQL5 KAT1 golden-vector failures detected." }
          if ($values["result"] -ne "PASS") { throw "MQL5 KAT1 conformance did not pass." }

          Copy-Item $evidence ".\build\stage07\Katarina_Stage07_kat1_codec_result.txt" -Force

      - name: Write Stage-07 MQL5 codec evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            metaeditor = (Get-Item "$env:MT5_HOME\metaeditor64.exe").VersionInfo.FileVersion
            vectors = 13
            compile = "PASS_0_ERRORS_0_WARNINGS"
            runtime = "PASS_MQL5_KAT1_GOLDEN_CONFORMANCE"
            ex5_sha256 = "$env:STAGE07_EX5_SHA256"
            result = "PASS_STAGE07_MQL5_KAT1_CODEC_BASELINE"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_mql5_kat1_codec_evidence.json" -Encoding UTF8

      - name: Upload Stage-07 MQL5 codec evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage07-mql5-kat1-codec-evidence
          path: |
            build/stage07/KatarinaStage07Kat1CodecTest.compile.log
            build/stage07/Katarina_Stage07_kat1_codec_result.txt
            build/stage07/stage07_mql5_kat1_codec_evidence.json
          retention-days: 30
