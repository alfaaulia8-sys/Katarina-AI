name: Stage 07 MT5 Wire Sequence Persistence

# Optional manual validation; main push is verified by Body CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-sequence:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Sequence"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Include\Katarina\Stage07" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Include\Katarina" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Scripts" | Out-Null

      - name: Stage sequence sources
        shell: pwsh
        run: |
          Copy-Item ".\mt5\Include\Katarina\BridgeIdentity.mqh" "$env:MT5_HOME\MQL5\Include\Katarina\BridgeIdentity.mqh" -Force
          Copy-Item ".\mt5\Include\Katarina\Stage07\WireSequence.mqh" "$env:MT5_HOME\MQL5\Include\Katarina\Stage07\WireSequence.mqh" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07WireSequenceTest.mq5" "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07WireSequenceTest.mq5" -Force

      - name: Strict compile wire sequence test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07WireSequenceTest.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07WireSequenceTest.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07WireSequenceTest.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "MetaEditor compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Wire sequence test compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Wire sequence EX5 missing." }

      - name: Run phase 1 before terminal restart
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $marker = Join-Path $commonFiles "Katarina_Stage07_wire_sequence_phase.txt"
          $evidence = Join-Path $commonFiles "Katarina_Stage07_wire_sequence_result.txt"
          Remove-Item $marker,$evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-sequence-phase1.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage07WireSequenceTest
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $p = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Phase-1 terminal exit code: $($p.ExitCode)"

          if (!(Test-Path $evidence)) { throw "Phase-1 evidence missing." }
          $content = Get-Content $evidence -Raw
          Write-Host $content
          if ($content -notmatch "result=PHASE1_PASS") { throw "Phase-1 sequence persistence did not pass." }
          if (!(Test-Path $marker)) { throw "Phase marker missing after phase 1." }

      - name: Run phase 2 after fresh terminal process
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          $evidence = Join-Path $commonFiles "Katarina_Stage07_wire_sequence_result.txt"
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-sequence-phase2.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage07WireSequenceTest
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $p = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Phase-2 terminal exit code: $($p.ExitCode)"

          if (!(Test-Path $evidence)) { throw "Phase-2 evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }

          Get-Content $evidence | Write-Host

          if ($values["result"] -ne "PASS") { throw "Persistent wire sequence did not pass." }
          if ($values["observed_last"] -ne "2") { throw "Restart did not recover sequence 2." }
          if ($values["allocated_next"] -ne "3") { throw "Restart did not allocate sequence 3." }

          Copy-Item $evidence ".\build\stage07\Katarina_Stage07_wire_sequence_result.txt" -Force

      - name: Write sequence persistence evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            lane = "MT5_TO_PYTHON"
            first_process_last = 2
            second_process_observed = 2
            second_process_next = 3
            duplicate_reuse = $false
            compile = "PASS_0_ERRORS_0_WARNINGS"
            result = "PASS_STAGE07_MT5_WIRE_SEQUENCE_RESTART"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_wire_sequence_evidence.json" -Encoding UTF8

      - name: Upload sequence persistence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-wire-sequence-evidence
          path: |
            build/stage07/KatarinaStage07WireSequenceTest.compile.log
            build/stage07/Katarina_Stage07_wire_sequence_result.txt
            build/stage07/stage07_wire_sequence_evidence.json
          retention-days: 30
