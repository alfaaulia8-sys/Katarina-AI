name: Stage 07 Cross-Language Recovery

# Manual native integration smoke only; Body CI owns push checks.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MQL5_ZMQ_REPO: coke5151/mql5-zmq
  MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
  KAT_RECOVERY_ENDPOINT: tcp://127.0.0.1:5570

jobs:
  recovery-integration:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Recovery"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage recovery integration files
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path $include,$libraries,$scripts | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null

          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07RecoveryIntegration.mq5" "$scripts\KatarinaStage07RecoveryIntegration.mq5" -Force

      - name: Strict compile recovery integration
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07RecoveryIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07RecoveryIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07RecoveryIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Recovery compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Recovery integration compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Recovery integration EX5 missing." }

          "STAGE07_RECOVERY_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write Python recovery peer
        shell: pwsh
        run: |
          @'
          import asyncio
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.recovery import Kat1RecoveryGate, RecoveryState
          from katarina.adapters.transport.session import HEARTBEAT, Kat1SessionSupervisor, SessionState
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          async def main():
              endpoint = os.environ["KAT_RECOVERY_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-recovery-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-recovery-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              session = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xA8" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              session.start()
              ready.write_text(endpoint, encoding="utf-8")

              presence = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              hello = session.observe(presence, now_ns=1_000_000_000)
              if hello is None:
                  raise RuntimeError("presence did not produce HELLO")
              await router.send_frame(hello.frame, peer=hello.peer)

              ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(ack, now_ns=1_100_000_000)
              if session.state is not SessionState.RECOVERING:
                  raise RuntimeError("HELLO_ACK did not enter RECOVERING")
              binding = session.binding
              if binding is None:
                  raise RuntimeError("HELLO_ACK binding missing")

              recovery = Kat1RecoveryGate(
                  codec=codec,
                  stream_id=binding.stream_id,
                  boot_id=binding.boot_id,
                  account_id=binding.account_id,
              )
              snapshot_request_id = b"\x44" * 16
              recovery.start(snapshot_request_id=snapshot_request_id)

              snapshot_request_sequence = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if snapshot_request_sequence != 2:
                  raise RuntimeError(
                      f"expected Python snapshot request sequence 2, got {snapshot_request_sequence}"
                  )
              snapshot_request = recovery.build_snapshot_request(
                  sequence=snapshot_request_sequence,
                  source_time_ns=1_200_000_000,
                  requested_record_mask=0x7F,
                  after_execution_cursor=0,
                  max_chunk_bytes=60000,
              )
              await router.send_frame(snapshot_request, peer=ack.peer)

              snapshot_messages = []
              now_ns = 2_000_000_000
              for expected_type in (11, 12, 13):
                  received = await asyncio.wait_for(router.receive_frame(), timeout=10.0)

                  # Session supervisor owns MT5→Python lane continuity even
                  # when message semantics are dispatched to the recovery gate.
                  session.observe(received, now_ns=now_ns)
                  decoded = codec.decode(received.frame)
                  if decoded.header.message_type != expected_type:
                      raise RuntimeError(
                          f"expected recovery type {expected_type}, got {decoded.header.message_type}"
                      )
                  if codec.reencode(decoded) != received.frame:
                      raise RuntimeError(
                          f"MQL5 recovery frame {expected_type} is not Python byte-identical"
                      )
                  recovery.observe(decoded)
                  snapshot_messages.append(decoded)
                  now_ns += 100_000_000

              if recovery.state is not RecoveryState.WAITING_RECONCILE:
                  raise RuntimeError(
                      f"snapshot did not reach WAITING_RECONCILE: {recovery.state}"
                  )

              chunk = snapshot_messages[1]
              records = chunk.values["records"]
              if len(records) != 1:
                  raise RuntimeError("synthetic snapshot did not contain one record")
              record = records[0]
              if record["record_type"] != 3 or record["schema_version"] != 1:
                  raise RuntimeError("snapshot embedded record identity mismatch")
              if record["body"] != b"stage07-synthetic-account-state":
                  raise RuntimeError("snapshot embedded record body mismatch")

              reconcile_request_id = b"\x55" * 16
              reconcile_sequence = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if reconcile_sequence != 3:
                  raise RuntimeError(
                      f"expected Python reconcile sequence 3, got {reconcile_sequence}"
                  )

              reconcile_request = recovery.build_reconcile_request(
                  sequence=reconcile_sequence,
                  source_time_ns=2_300_000_000,
                  request_id=reconcile_request_id,
                  after_event_cursor=5,
                  scope_flags=0xFFFFFFFF,
              )
              await router.send_frame(reconcile_request, peer=ack.peer)

              report_received = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(report_received, now_ns=2_400_000_000)
              report = codec.decode(report_received.frame)
              if report.header.message_type != 313:
                  raise RuntimeError("expected RECONCILE_REPORT")
              if codec.reencode(report) != report_received.frame:
                  raise RuntimeError("MQL5 RECONCILE_REPORT is not Python byte-identical")
              recovery.observe(report)

              if recovery.state is not RecoveryState.COMPLETE:
                  raise RuntimeError(f"recovery did not complete: {recovery.state}")
              if not recovery.communication_ready or recovery.live_risk_ready:
                  raise RuntimeError("recovery gate readiness/live-risk semantics invalid")

              session.mark_recovered(now_ns=2_500_000_000)
              if session.state is not SessionState.READY:
                  raise RuntimeError("session did not promote to READY")
              if not session.communication_ready or session.live_risk_ready:
                  raise RuntimeError("session READY/live-risk semantics invalid")

              heartbeat_sequence = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if heartbeat_sequence != 4:
                  raise RuntimeError(
                      f"expected Python READY heartbeat sequence 4, got {heartbeat_sequence}"
                  )
              python_heartbeat = codec.encode(
                  message_type=HEARTBEAT,
                  schema_version=1,
                  sequence=heartbeat_sequence,
                  source_time_ns=2_550_000_000,
                  stream_id=binding.stream_id,
                  boot_id=binding.boot_id,
                  values={
                      "uptime_ms": 2550,
                      "latest_produced_sequence": heartbeat_sequence,
                      "latest_consumed_command_sequence": 6,
                      "critical_queue_depth": 0,
                      "market_queue_depth": 0,
                      "last_broker_observation_ns": 2_550_000_000,
                      "transport_state": 1,
                  },
              )
              await router.send_frame(python_heartbeat, peer=ack.peer)

              final_mt5 = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(final_mt5, now_ns=2_600_000_000)
              final_decoded = codec.decode(final_mt5.frame)
              if final_decoded.header.message_type != HEARTBEAT:
                  raise RuntimeError("final MT5 frame is not HEARTBEAT")
              if final_decoded.header.sequence != 7:
                  raise RuntimeError(
                      f"final MT5 sequence expected 7, got {final_decoded.header.sequence}"
                  )
              if session.state is not SessionState.READY:
                  raise RuntimeError("final heartbeat changed READY state")
              if session.live_risk_ready:
                  raise RuntimeError("Stage 07 illegally granted live-risk readiness")

              result.write_text(json.dumps({
                  "result": "PASS",
                  "snapshot_request_sequence": snapshot_request_sequence,
                  "reconcile_request_sequence": reconcile_sequence,
                  "ready_heartbeat_sequence": heartbeat_sequence,
                  "mt5_final_sequence": final_decoded.header.sequence,
                  "snapshot_state": recovery.state.value,
                  "session_state": session.state.value,
                  "communication_ready": session.communication_ready,
                  "live_risk_ready": session.live_risk_ready,
                  "mql_to_python_byte_equality": True,
                  "python_to_mql_byte_equality": True,
                  "snapshot_record_type": record["record_type"],
                  "snapshot_record_schema": record["schema_version"],
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_recovery_peer.py" -Encoding UTF8

      - name: Run cross-language snapshot reconciliation
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-recovery-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-recovery-python-result.json"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $peer = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_recovery_peer.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($peer.HasExited) { throw "Python recovery peer exited before ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python recovery peer did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_recovery_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-recovery.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07RecoveryIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $peer.WaitForExit(15000) | Out-Null
          if (-not $peer.HasExited) {
            Stop-Process -Id $peer.Id -Force
            throw "Python recovery peer did not terminate."
          }
          if ($peer.ExitCode -ne 0) { throw "Python recovery peer failed with exit code $($peer.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 recovery evidence missing." }
          if (!(Test-Path $pythonResult)) { throw "Python recovery evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }
          $python = Get-Content $pythonResult -Raw | ConvertFrom-Json

          Get-Content $mt5Evidence | Write-Host
          Get-Content $pythonResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "MT5 recovery integration did not pass." }
          if ($values["request_byte_equality"] -ne "1") { throw "Python→MQL snapshot request equality failed." }
          if ($values["reconcile_request_byte_equality"] -ne "1") { throw "Python→MQL reconcile equality failed." }
          if ($python.result -ne "PASS") { throw "Python recovery result did not pass." }
          if ($python.session_state -ne "ready") { throw "Session did not end READY." }
          if ($python.communication_ready -ne $true) { throw "Communication readiness missing." }
          if ($python.live_risk_ready -ne $false) { throw "Stage 07 must never grant live-risk readiness." }
          if ($python.mql_to_python_byte_equality -ne $true -or $python.python_to_mql_byte_equality -ne $true) {
            throw "Cross-language byte equality failed."
          }

          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_recovery_result.txt" -Force
          Copy-Item $pythonResult ".\build\stage07\stage07_recovery_python_result.json" -Force

      - name: Write recovery evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            topology = "PYTHON_ROUTER_MT5_DEALER"
            flow = "HANDSHAKE_SNAPSHOT_RECONCILE_READY"
            snapshot_semantics = "ADR_0011_PROPOSED"
            sequence_semantics = "ADR_0012_PROPOSED"
            python_to_mql_byte_equality = "PASS"
            mql_to_python_byte_equality = "PASS"
            chunk_crc32c = "PASS"
            aggregate_crc32c = "PASS"
            atomic_snapshot = "PASS"
            clean_reconciliation = "PASS"
            final_state = "READY"
            communication_ready = $true
            live_risk_ready = $false
            compile = "PASS_0_ERRORS_0_WARNINGS"
            ex5_sha256 = "$env:STAGE07_RECOVERY_EX5_SHA256"
            result = "PASS_STAGE07_CROSS_LANGUAGE_RECOVERY"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_recovery_evidence.json" -Encoding UTF8

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage07-cross-language-recovery-evidence
          path: |
            build/stage07/KatarinaStage07RecoveryIntegration.compile.log
            build/stage07/Katarina_Stage07_recovery_result.txt
            build/stage07/stage07_recovery_python_result.json
            build/stage07/stage07_recovery_evidence.json
          retention-days: 30
