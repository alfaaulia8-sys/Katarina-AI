name: KATARINA VPS2012 Python 3.8 CI

on:
  push:
    branches: [vps-control]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/vps2012/**"
      - "requirements-vps2012.txt"
      - ".github/workflows/vps2012-python38-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python38:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install VPS2012 dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-vps2012.txt

      - name: Compile Python
        run: PYTHONPATH=src python -m compileall -q src

      - name: Unit regression
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p 'test_*.py'

      - name: Static regression
        run: PYTHONPATH=src python -m unittest discover -s tests/static -p 'test_*.py'
