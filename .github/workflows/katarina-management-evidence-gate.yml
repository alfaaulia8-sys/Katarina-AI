name: KATARINA Management Evidence Gate

# Manual-only to avoid GitHub Actions request storms on the resource-limited
# project. Runs solely on an isolated GitHub-hosted runner, never the VPS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: management-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  management:
    name: Management 15-stage acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Verify all management roles with genuine regression evidence
        run: python scripts/ai/management_acceptance.py --commit "${{ github.sha }}" > "${{ runner.temp }}/management-evidence.json"
      - name: Publish Manager evidence in GitHub job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "management-evidence.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Katarina Management Evidence\n\n")
              if not p.is_file():
                  f.write("**BLOCKED** — acceptance did not produce evidence.\n")
              else:
                  record = json.loads(p.read_text(encoding="utf-8"))
                  f.write("**Engineering:** {}. **Release:** {}.\n\n".format(
                      record["status"], record["release_status"]))
                  f.write("Specialists independently checked: {}. Trading orders: {}.\n".format(
                      record["specialists_verified"], record["orders_sent"]))
                  f.write("No automatic merge or trading deployment.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/management-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify governance unit suite
        run: python -m unittest discover -s tests/unit/governance -p 'test_*.py' -q
      - name: Verify workflow request budget
        run: python -m unittest tests.static.test_github_action_fanout -q

  full-regression:
    name: Full offline unit/static/integration regression
    needs: management
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Unit regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -q
      - name: Static regression
        run: python -m unittest discover -s tests/static -p 'test_*.py' -q
      - name: Integration regression
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -q

# There is intentionally no deploy, merge, self-hosted runner, external model
# invocation, broker token, order routing or live MT5 process in this workflow.
