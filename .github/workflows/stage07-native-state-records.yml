name: Stage 07 Native State Records

# Manual native integration smoke only; Body CI owns push checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-state-records:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "$env:RUNNER_TEMP\mt5setup.exe"

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07NativeState"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Start-Sleep -Seconds 3
          $candidates = @($requested,"$env:ProgramFiles\MetaTrader 5","$env:ProgramFiles\MetaTrader 5 Terminal")
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and (Test-Path "$candidate\metaeditor64.exe") -and (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }
          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }
          if (-not $resolved) { throw "MetaTrader installation files not found." }
          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage MQL5 sources
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"
          New-Item -ItemType Directory -Force -Path $include,$scripts | Out-Null
          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07NativeStateRecordsTest.mq5" "$scripts\KatarinaStage07NativeStateRecordsTest.mq5" -Force

      - name: Strict compile native state records test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07NativeStateRecordsTest.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07NativeStateRecordsTest.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07NativeStateRecordsTest.compile.log"
          $args = @("/compile:`"$source`"","/inc:`"$env:MT5_HOME\MQL5`"","/log:`"$log`"")
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null
          if (!(Test-Path $log)) { throw "Compile log missing." }
          $text = Get-Content $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") { throw "Compile is not 0/0." }
          if (!(Test-Path $artifact)) { throw "EX5 missing." }

      - name: Run MQL5 native state records test
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $evidence = Join-Path $commonFiles "Katarina_Stage07_native_state_records_result.txt"
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue
          $config = Join-Path $env:RUNNER_TEMP "stage07-native-state.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage07NativeStateRecordsTest
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII
          $p = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable","/config:`"$config`"") -Wait -PassThru
          if (!(Test-Path $evidence)) { throw "MQL evidence missing." }
          Get-Content $evidence | Write-Host
          if ((Get-Content $evidence -Raw) -notmatch "result=PASS") { throw "MQL native state records failed." }
          Copy-Item $evidence ".\build\stage07\Katarina_Stage07_native_state_records_result.txt" -Force

      - name: Verify state bodies against Python KAT1 codec
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "src"))
          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog

          values = {}
          source = root / "build" / "stage07" / "Katarina_Stage07_native_state_records_result.txt"
          for line in source.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key] = value

          codec = Kat1Codec(SchemaCatalog.from_path(root / "protocol" / "kat1_message_schemas_v1.json"))

          server = b"Katarina-CI"
          material = b"KAT1/account-id/v1" + b"\x00" + len(server).to_bytes(4,"little") + server + b"\x00" + b"123456"
          account_id = hashlib.sha256(material).digest()[:16]

          fixtures = {
              "symbol_body_hex": (
                  102,
                  {
                      "instrument_id": 1,
                      "spec_revision": 7,
                      "digits": 2,
                      "price_scale": 2,
                      "volume_scale": 2,
                      "trade_calc_mode_raw": 0,
                      "trade_mode_raw": 4,
                      "swap_mode_raw": 1,
                      "order_mode_bits": 127,
                      "filling_mode_bits": 3,
                      "expiration_mode_bits": 15,
                      "stops_level_points": 20,
                      "freeze_level_points": 5,
                      "point_units": 1,
                      "tick_size_units": 1,
                      "tick_value_units": 123,
                      "tick_value_profit_units": 124,
                      "tick_value_loss_units": 122,
                      "contract_size_e8": 10000000000,
                      "volume_min_units": 1,
                      "volume_max_units": 10000,
                      "volume_step_units": 1,
                      "volume_limit_units": 20000,
                      "margin_initial_units": 0,
                      "margin_maintenance_units": 0,
                      "swap_long_e8": -1250000000,
                      "swap_short_e8": 325000000,
                      "swap_sunday_e4": 10000,
                      "swap_monday_e4": 10000,
                      "swap_tuesday_e4": 10000,
                      "swap_wednesday_e4": 30000,
                      "swap_thursday_e4": 10000,
                      "swap_friday_e4": 10000,
                      "swap_saturday_e4": 10000,
                      "symbol_flags": 0,
                      "canonical_symbol": "XAUUSD",
                      "broker_symbol": "XAUUSD.a",
                      "base_currency": "XAU",
                      "profit_currency": "USD",
                      "margin_currency": "USD",
                  },
              ),
              "session_body_hex": (
                  103,
                  {
                      "instrument_id": 1,
                      "spec_revision": 7,
                      "state_revision": 11,
                      "last_tick_time_ns": 1790956800123000000,
                      "server_time_ns": 1790956800000000000,
                      "scheduled_open": 1,
                      "terminal_connected": 1,
                      "terminal_trade_allowed": 1,
                      "mql_trade_allowed": 1,
                      "symbol_trade_allowed": 1,
                      "fresh_tick": 1,
                      "session_open": 1,
                      "terminal_ping_us": 33000,
                  },
              ),
              "position_body_hex": (
                  201,
                  {
                      "account_id": account_id,
                      "position_ticket": 10001,
                      "position_identifier": 11001,
                      "instrument_id": 1,
                      "spec_revision": 7,
                      "magic": 778899,
                      "position_revision": 9,
                      "open_time_ns": 1790956800123000000,
                      "update_time_ns": 1790956860456000000,
                      "volume_units": 10,
                      "open_price_units": 428635,
                      "current_price_units": 428711,
                      "sl_units": 427500,
                      "tp_units": 431000,
                      "profit_units": 3550,
                      "swap_units": -125,
                      "change_kind": 1,
                      "side": 1,
                      "origin_class": 1,
                      "position_reason_raw": 3,
                      "presence_flags": 0,
                      "position_type_raw": 0,
                  },
              ),
              "order_body_hex": (
                  202,
                  {
                      "account_id": account_id,
                      "broker_order_ticket": 8001,
                      "linked_order_id": bytes(16),
                      "instrument_id": 1,
                      "spec_revision": 7,
                      "magic": 778899,
                      "order_revision": 4,
                      "create_time_ns": 1790956800123000000,
                      "update_time_ns": 0,
                      "volume_initial_units": 10,
                      "volume_current_units": 10,
                      "price_open_units": 428000,
                      "stop_limit_units": 0,
                      "sl_units": 427000,
                      "tp_units": 431000,
                      "expiration_time_ns": 1790960400000000000,
                      "change_kind": 1,
                      "side": 1,
                      "entry_type": 2,
                      "origin_class": 1,
                      "normalized_order_state": 2,
                      "time_in_force": 2,
                      "filling_policy": 1,
                      "presence_flags": 0,
                      "order_type_raw": 2,
                      "order_state_raw": 1,
                      "order_reason_raw": 3,
                  },
              ),
          }

          checked = {}
          for evidence_key, (message_type, logical) in fixtures.items():
              actual = bytes.fromhex(values[evidence_key])
              frame = codec.encode(
                  message_type=message_type,
                  schema_version=1,
                  sequence=1,
                  source_time_ns=1,
                  stream_id=77,
                  boot_id=88,
                  values=logical,
              )
              decoded = codec.decode(frame)
              expected = decoded.payload
              if actual != expected:
                  limit = min(len(actual), len(expected))
                  mismatch = next((i for i in range(limit) if actual[i] != expected[i]), None)
                  raise RuntimeError(
                      f"{evidence_key} mismatch: actual={len(actual)} expected={len(expected)} "
                      f"first_offset={mismatch}"
                  )
              checked[evidence_key] = len(actual)

          out = root / "build" / "stage07" / "stage07_native_state_records_evidence.json"
          out.write_text(json.dumps({
              "schema_version": "1.0",
              "stage": "07",
              "records": checked,
              "cross_language_byte_equality": "PASS",
              "result": "PASS_STAGE07_NATIVE_STATE_RECORDS",
          }, indent=2), encoding="utf-8")
          print("Stage-07 native SYMBOL/SESSION/POSITION/ORDER body equality PASS")
          '@ | python

      - name: Upload native state record evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage07-native-state-records-evidence
          path: |
            build/stage07/KatarinaStage07NativeStateRecordsTest.compile.log
            build/stage07/Katarina_Stage07_native_state_records_result.txt
            build/stage07/stage07_native_state_records_evidence.json
          retention-days: 30
