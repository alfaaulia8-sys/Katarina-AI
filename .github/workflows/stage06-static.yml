name: Stage 06 Static Evidence

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage06-static:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Stage 06 static regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.static.test_stage06_mt5_bridge tests.static.test_stage06_windows_compatibility -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write evidence
        shell: pwsh
        run: |
          $pythonVersion = (python --version 2>&1 | Out-String).Trim()
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "06"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner_os = "$env:RUNNER_OS"
            runner_name = "$env:RUNNER_NAME"
            runner_arch = "$env:RUNNER_ARCH"
            image = "windows-2022"
            python_version = $pythonVersion
            suite = @(
              "tests.static.test_stage06_mt5_bridge",
              "tests.static.test_stage06_windows_compatibility"
            )
            result = "PASS_STAGE06_STATIC_REGRESSIONS"
          }
          New-Item -ItemType Directory -Force -Path "build\mt5" | Out-Null
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Path "build\mt5\stage06_static_evidence.json" -Encoding UTF8

      - name: Upload static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage06-static-evidence
          path: build/mt5/stage06_static_evidence.json
          retention-days: 30
