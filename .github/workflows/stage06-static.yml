name: Stage 06 Static Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage06-static.yml"
      - "mt5/**"
      - "scripts/mt5/**"
      - "tests/static/test_stage06_*.py"
      - "config/windows_compatibility_stage06.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage06-static:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Stage 06 static regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.static.test_stage06_mt5_bridge tests.static.test_stage06_windows_compatibility -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write evidence
        shell: pwsh
        run: |
          $pythonVersion = (python --version 2>&1 | Out-String).Trim()
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "06"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner_os = "$env:RUNNER_OS"
            runner_name = "$env:RUNNER_NAME"
            runner_arch = "$env:RUNNER_ARCH"
            image = "windows-2022"
            python_version = $pythonVersion
            suite = @(
              "tests.static.test_stage06_mt5_bridge",
              "tests.static.test_stage06_windows_compatibility"
            )
            result = "PASS_STAGE06_STATIC_REGRESSIONS"
          }
          New-Item -ItemType Directory -Force -Path "build\mt5" | Out-Null
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Path "build\mt5\stage06_static_evidence.json" -Encoding UTF8

      - name: Upload static evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage06-static-evidence
          path: build/mt5/stage06_static_evidence.json
          retention-days: 30
