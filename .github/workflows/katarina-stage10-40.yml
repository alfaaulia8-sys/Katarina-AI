name: KATARINA Stage 10-40 Baseline

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

jobs:
  python-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stage 07 runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-stage07.txt ]; then pip install -r requirements-stage07.txt; fi
          python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile Python
        run: python -m compileall -q src
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p "test_*.py" -v
      - name: Static tests
        run: PYTHONPATH=src python -m unittest discover -s tests/static -p "test_*.py" -v
      - name: Stage 11-40 integration
        run: PYTHONPATH=src python -m unittest discover -s tests/integration -p "test_stage11_40_pipeline.py" -v
      - name: Stage 11-40 audit
        run: PYTHONPATH=src python scripts/stage_all/audit_stage_11_40.py
