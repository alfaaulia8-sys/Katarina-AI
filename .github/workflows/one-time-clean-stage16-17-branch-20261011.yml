name: One-time remove merged Stage 16-17 research branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-clean-stage16-17-branch-20261011.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  prune-merged-ref:
    if: github.repository == 'alfaauliau-katarinaAI/Katarina-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact approved merged ref only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          base="https://api.github.com/repos/alfaauliau-katarinaAI/Katarina-AI"
          branch="research/stage16-17-cost-margin-20261011"
          sha="c25d4b45f2febae314e06d254ac7456dc6da8756"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          def call(method,path,allow_missing=False):
              req=urllib.request.Request(base+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read()
                      return json.loads(data) if data else {}
              except urllib.error.HTTPError as e:
                  if allow_missing and e.code==404: return None
                  raise
          pr=call("GET","/pulls/25")
          assert pr["merged"] is True and pr["head"]["ref"]==branch and pr["head"]["sha"]==sha
          url="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          ref=call("GET",url,True)
          if ref is not None:
              assert ref["object"]["sha"]==sha, "branch moved, refuse deletion"
              call("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          assert call("GET",url,True) is None
          print("PASS_MERGED_RESEARCH_BRANCH_REMOVED")
          PY
