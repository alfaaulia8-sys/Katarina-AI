name: Stage 07 Cross-Language Handshake

# Manual native integration smoke only; Body CI owns push checks.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MQL5_ZMQ_REPO: coke5151/mql5-zmq
  MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
  KAT_HANDSHAKE_ENDPOINT: tcp://127.0.0.1:5568

jobs:
  cross-language-handshake:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -c "import zmq, tornado; print('pyzmq=' + zmq.__version__ + ' libzmq=' + zmq.zmq_version() + ' tornado=' + tornado.version)"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Handshake"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage binding and handshake script
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Katarina\Stage07" | Out-Null
          New-Item -ItemType Directory -Force -Path $libraries | Out-Null
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null

          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Include\Katarina\Stage07\*.mqh" "$include\Katarina\Stage07\" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07HandshakeIntegration.mq5" "$scripts\KatarinaStage07HandshakeIntegration.mq5" -Force

      - name: Strict compile handshake script
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07HandshakeIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07HandshakeIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07HandshakeIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "MetaEditor compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Stage-07 handshake compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Stage-07 handshake EX5 missing." }
          if ((Get-Item $artifact).Length -le 0) { throw "Stage-07 handshake EX5 is empty." }

          "STAGE07_HANDSHAKE_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write Python KAT1 session server
        shell: pwsh
        run: |
          @'
          import asyncio
          import hashlib
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.session import (
              HEARTBEAT,
              Kat1SessionSupervisor,
              SessionState,
          )
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          async def main():
              endpoint = os.environ["KAT_HANDSHAKE_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-handshake-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-handshake-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              supervisor = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xAA" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              supervisor.start()
              ready.write_text(endpoint, encoding="utf-8")

              presence = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              hello_send = supervisor.observe(presence, now_ns=1_000_000_000)
              if hello_send is None:
                  raise RuntimeError("presence HEARTBEAT did not produce HELLO")
              if supervisor.state is not SessionState.HELLO_SENT:
                  raise RuntimeError(f"unexpected state after presence: {supervisor.state}")
              await router.send_frame(hello_send.frame, peer=hello_send.peer)

              hello_ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              supervisor.observe(hello_ack, now_ns=1_100_000_000)
              if supervisor.state is not SessionState.RECOVERING:
                  raise RuntimeError(f"HELLO_ACK did not enter RECOVERING: {supervisor.state}")
              if supervisor.communication_ready:
                  raise RuntimeError("communication became READY before recovery/reconciliation")
              if supervisor.live_risk_ready:
                  raise RuntimeError("Stage 07 illegally granted live-risk readiness")

              binding = supervisor.binding
              if binding is None:
                  raise RuntimeError("HELLO_ACK did not create binding")
              if binding.stream_id != 77 or binding.boot_id != 88:
                  raise RuntimeError("binding stream/boot mismatch")
              if binding.broker_login != 123456 or binding.broker_server != "Katarina-CI":
                  raise RuntimeError("binding account identity mismatch")

              server = b"Katarina-CI"
              login_ascii = b"123456"
              material = (
                  b"KAT1/account-id/v1"
                  + b"\x00"
                  + len(server).to_bytes(4, "little")
                  + server
                  + b"\x00"
                  + login_ascii
              )
              expected_account_id = hashlib.sha256(material).digest()[:16].hex()
              if binding.account_id != expected_account_id:
                  raise RuntimeError(
                      f"account_id mismatch: expected={expected_account_id} actual={binding.account_id}"
                  )

              python_heartbeat = codec.encode(
                  message_type=HEARTBEAT,
                  schema_version=1,
                  sequence=2,
                  source_time_ns=1_150_000_000,
                  stream_id=77,
                  boot_id=88,
                  values={
                      "uptime_ms": 1150,
                      "latest_produced_sequence": 2,
                      "latest_consumed_command_sequence": 0,
                      "critical_queue_depth": 0,
                      "market_queue_depth": 0,
                      "last_broker_observation_ns": 1_150_000_000,
                      "transport_state": 1,
                  },
              )
              await router.send_frame(python_heartbeat, peer=hello_ack.peer)

              final_ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              final_frame = codec.decode(final_ack.frame)
              if final_frame.header.message_type != HEARTBEAT:
                  raise RuntimeError("final MT5 ACK is not HEARTBEAT")
              if final_frame.header.stream_id != 77 or final_frame.header.boot_id != 88:
                  raise RuntimeError("final MT5 ACK binding mismatch")
              supervisor.observe(final_ack, now_ns=1_200_000_000)

              if supervisor.state is not SessionState.RECOVERING:
                  raise RuntimeError("final heartbeat changed RECOVERING state unexpectedly")
              if supervisor.communication_ready or supervisor.live_risk_ready:
                  raise RuntimeError("handshake incorrectly granted readiness/live risk")

              result.write_text(json.dumps({
                  "result": "PASS",
                  "endpoint": endpoint,
                  "state": supervisor.state.value,
                  "communication_ready": supervisor.communication_ready,
                  "live_risk_ready": supervisor.live_risk_ready,
                  "account_id": binding.account_id,
                  "broker_login": binding.broker_login,
                  "broker_server": binding.broker_server,
                  "stream_id": binding.stream_id,
                  "boot_id": binding.boot_id,
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_handshake_server.py" -Encoding UTF8

      - name: Run cross-language KAT1 handshake
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-handshake-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-handshake-python-result.json"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $server = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_handshake_server.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($server.HasExited) { throw "Python handshake server exited before ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python handshake server did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_handshake_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-handshake.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07HandshakeIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $server.WaitForExit(15000) | Out-Null
          if (-not $server.HasExited) {
            Stop-Process -Id $server.Id -Force
            throw "Python handshake server did not terminate."
          }
          if ($server.ExitCode -ne 0) { throw "Python handshake server failed with exit code $($server.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 handshake evidence missing." }
          if (!(Test-Path $pythonResult)) { throw "Python handshake evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }
          $python = Get-Content $pythonResult -Raw | ConvertFrom-Json

          Get-Content $mt5Evidence | Write-Host
          Get-Content $pythonResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "MT5 cross-language handshake did not pass." }
          if ($values["live_risk_ready"] -ne "0") { throw "MT5 evidence incorrectly marks live risk ready." }
          if ($python.result -ne "PASS") { throw "Python handshake result did not pass." }
          if ($python.state -ne "recovering") { throw "Python session must remain RECOVERING." }
          if ($python.communication_ready -ne $false) { throw "Communication must not be READY before recovery." }
          if ($python.live_risk_ready -ne $false) { throw "Stage 07 must never grant live-risk readiness." }

          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_handshake_result.txt" -Force
          Copy-Item $pythonResult ".\build\stage07\stage07_handshake_python_result.json" -Force

      - name: Write handshake evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            dependency_repo = "$env:MQL5_ZMQ_REPO"
            dependency_commit = "$env:MQL5_ZMQ_COMMIT"
            endpoint = "$env:KAT_HANDSHAKE_ENDPOINT"
            topology = "PYTHON_ROUTER_MT5_DEALER"
            flow = "HEARTBEAT_TO_HELLO_TO_HELLO_ACK"
            final_state = "RECOVERING"
            communication_ready = $false
            live_risk_ready = $false
            compile = "PASS_0_ERRORS_0_WARNINGS"
            ex5_sha256 = "$env:STAGE07_HANDSHAKE_EX5_SHA256"
            result = "PASS_STAGE07_CROSS_LANGUAGE_HANDSHAKE"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_handshake_evidence.json" -Encoding UTF8

      - name: Upload handshake evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage07-cross-language-handshake-evidence
          path: |
            build/stage07/KatarinaStage07HandshakeIntegration.compile.log
            build/stage07/Katarina_Stage07_handshake_result.txt
            build/stage07/stage07_handshake_python_result.json
            build/stage07/stage07_handshake_evidence.json
          retention-days: 30
