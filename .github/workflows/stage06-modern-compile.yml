name: Stage 06 Modern MetaEditor Proof

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-compile:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage06"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )

          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          Write-Host "Resolved MT5 home: $resolved"
          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Experts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Scripts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Include" | Out-Null

      - name: Strict Stage 06 MetaEditor compile
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\mt5\compile_stage06.ps1" -TerminalDataPath "$env:MT5_HOME" -MetaEditorPath "$env:MT5_HOME\metaeditor64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content ".\build\mt5\stage06_compile_evidence.json" -Raw | ConvertFrom-Json
          if ($evidence.result -ne "PASS_COMPILE_PROOF") { throw "Modern compile evidence did not pass." }
          if ($evidence.host.normalized -ne "WINDOWS_SERVER_2022_X64") { throw "Unexpected host: $($evidence.host.normalized)" }

      - name: Run Stage 06 MQL self-test headless
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $evidencePath = Join-Path $commonFiles "Katarina_Stage06_self_test_result.txt"
          Remove-Item $evidencePath -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage06-selftest.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage06SelfTest
          Symbol=EURUSD
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Join-Path $env:MT5_HOME "terminal64.exe"
          $p = Start-Process -FilePath $terminal -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal self-test exit code: $($p.ExitCode)"

          if (!(Test-Path $evidencePath)) {
            throw "Stage 06 self-test evidence was not created."
          }

          $values = @{}
          foreach ($line in Get-Content $evidencePath) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }

          if ($values["stage"] -ne "06") { throw "Unexpected self-test stage." }
          if ($values["design_version"] -ne "0.5.0") { throw "Unexpected self-test design version." }
          if ($values["proof_type"] -ne "MQL_SELF_TEST") { throw "Unexpected self-test proof type." }
          if ($values["result"] -ne "PASS") { throw "MQL self-test did not pass." }

          New-Item -ItemType Directory -Force -Path "build\mt5" | Out-Null
          Copy-Item $evidencePath "build\mt5\Katarina_Stage06_self_test_result.txt" -Force

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage 06 final evidence-bound audit
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\mt5\audit_stage06_final.ps1" -PythonExe python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clearance = Get-Content ".\build\mt5\stage06_final_clearance.json" -Raw | ConvertFrom-Json
          if ($clearance.result -ne "PASS_STAGE06_FINAL_CLEARANCE") {
            throw "Stage 06 final clearance did not pass."
          }
          if ([int]$clearance.static_regressions.total -ne 35) {
            throw "Unexpected Stage 06 static regression count."
          }

      - name: Upload Stage 06 final freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage06-final-freeze-evidence
          path: |
            build/mt5/stage06_compile_evidence.json
            build/mt5/*.compile.log
            build/mt5/Katarina_Stage06_self_test_result.txt
            build/mt5/stage06_final_clearance.json
            build/mt5/STAGE_06_FINAL_AUDIT_CANDIDATE.md
          retention-days: 30
