name: Stage 07 Final Clearance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage07-final-clearance.yml"
      - "mt5/Include/Katarina/Stage07/NativeTcpTransport.mqh"
      - "mt5/Tests/KatarinaStage07TcpFallbackIntegration.mq5"
      - "scripts/stage07/profile_stage07_transport.py"
      - "scripts/stage07/audit_stage07_final.py"
      - "scripts/stage07/configure_mt5_network_allowlist.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-clearance:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check pywinauto

      - name: Run Stage 07 Python regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.unit.transport.test_stage07_communication tests.unit.transport.test_stage07_stage06_contract -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\stage07_python_tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content "$env:RUNNER_TEMP\stage07_python_tests.txt" -Raw
          if ($text -notmatch "Ran 37 tests" -or $text -notmatch "(?m)^OK\s*$") {
            throw "Expected 37/37 Stage-07 Python tests."
          }

      - name: Download and install MetaTrader 5
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $requested = "C:\MT5Stage07Final"
          $p = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }
          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $resolved = Split-Path -Parent $found.FullName }
          }
          if (-not $resolved) { throw "MetaTrader 5 installation not found." }
          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage and compile native TCP proof
        shell: pwsh
        run: |
          $mql = "$env:MT5_HOME\MQL5"
          New-Item -ItemType Directory -Force -Path "$mql\Include\Katarina\Stage07","$mql\Scripts",".\build\stage07" | Out-Null
          Copy-Item ".\mt5\Include\Katarina\*" "$mql\Include\Katarina\" -Recurse -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07TcpFallbackIntegration.mq5" "$mql\Scripts\KatarinaStage07TcpFallbackIntegration.mq5" -Force

          $source = "$mql\Scripts\KatarinaStage07TcpFallbackIntegration.mq5"
          $artifact = "$mql\Scripts\KatarinaStage07TcpFallbackIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07TcpFallbackIntegration.compile.log"
          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue

          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$mql`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null
          if (!(Test-Path $log)) { throw "Native TCP compile log missing." }
          $text = Get-Content $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") { throw "Native TCP proof compile failed." }
          if (!(Test-Path $artifact)) { throw "Native TCP EX5 missing." }
          "TCP_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure localhost socket allow-list through MT5 UI
        shell: pwsh
        run: |
          python .\scripts\stage07\configure_mt5_network_allowlist.py --terminal "$env:MT5_HOME\terminal64.exe" --output ".\build\stage07\stage07_mt5_allowlist_ui.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ui = Get-Content ".\build\stage07\stage07_mt5_allowlist_ui.json" -Raw | ConvertFrom-Json
          if ($ui.result -ne "PASS_MT5_NETWORK_ALLOWLIST_UI") {
            throw "MT5 localhost allow-list UI automation did not pass."
          }

      - name: Run cross-language native TCP fallback
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-tcp-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-tcp-python-result.json"
          $serverScript = "$env:RUNNER_TEMP\kat_tcp_peer.py"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          @'
          import asyncio
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT))
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.tcp import Kat1TcpServerTransport

          async def main():
              ready = pathlib.Path(os.environ["KAT_TCP_READY"])
              result = pathlib.Path(os.environ["KAT_TCP_RESULT"])
              codec = Kat1Codec(SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json"))
              transport = Kat1TcpServerTransport(host="127.0.0.1", port=5572, receive_capacity=8)
              await transport.start()
              ready.write_text("READY", encoding="utf-8")
              try:
                  received = await asyncio.wait_for(transport.receive_frame(), timeout=30.0)
                  decoded = codec.decode(received.frame)
                  await transport.send_frame(received.frame, peer=received.peer)
                  result.write_text(json.dumps({
                      "result": "PASS",
                      "message_type": decoded.header.message_type,
                      "sequence": decoded.header.sequence,
                      "stream_id": decoded.header.stream_id,
                      "boot_id": decoded.header.boot_id,
                      "frame_length": len(received.frame),
                      "byte_echo": True,
                  }, indent=2), encoding="utf-8")
              finally:
                  await transport.stop()

          asyncio.run(main())
          '@ | Set-Content -Path $serverScript -Encoding UTF8

          $env:KAT_TCP_READY = $ready
          $env:KAT_TCP_RESULT = $pythonResult
          $peer = Start-Process -FilePath "python" -ArgumentList $serverScript -PassThru -NoNewWindow
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
              if ($peer.HasExited) { throw "Python TCP peer exited before ready." }
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $ready)) { throw "Python TCP peer did not become ready." }

            $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
            New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
            $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_tcp_fallback_result.txt"
            Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

            $config = "$env:RUNNER_TEMP\stage07-tcp-final.ini"
            @(
              "[Experts]",
              "AllowLiveTrading=0",
              "AllowDllImport=0",
              "Enabled=1",
              "Account=0",
              "Profile=0",
              "WebRequest=1",
              "WebRequestUrl=127.0.0.1",
              "",
              "[StartUp]",
              "Script=KatarinaStage07TcpFallbackIntegration",
              "Symbol=",
              "Period=H1",
              "ShutdownTerminal=1"
            ) | Set-Content -Path $config -Encoding ASCII

            $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
            Write-Host "Terminal exit code: $($terminal.ExitCode)"

            # Read the MQL result first. If SocketConnect was blocked, the
            # script exits quickly while the Python peer is still waiting.
            if (!(Test-Path $mt5Evidence)) {
              Write-Host "MT5 evidence path missing: $mt5Evidence"
              $terminalLogs = Get-ChildItem -Path "$env:MT5_HOME\logs" -Filter "*.log" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 2
              foreach ($log in $terminalLogs) {
                Write-Host "--- terminal log $($log.FullName) ---"
                Get-Content $log.FullName -Tail 120 -ErrorAction SilentlyContinue | Write-Host
              }
              throw "MT5 TCP evidence missing."
            }

            $mt5Text = Get-Content $mt5Evidence -Raw
            Write-Host "--- MT5 native TCP evidence ---"
            Write-Host $mt5Text
            if ($mt5Text -notmatch "result=PASS") {
              throw "Native TCP proof failed: $mt5Text"
            }

            [void]$peer.WaitForExit(10000)
            if (-not $peer.HasExited) { throw "Python TCP peer did not finish after MQL reported PASS." }
            if ($peer.ExitCode -ne 0) { throw "Python TCP peer failed: $($peer.ExitCode)" }
            if (!(Test-Path $pythonResult)) { throw "Python TCP result missing." }

            $py = Get-Content $pythonResult -Raw | ConvertFrom-Json
            if ($py.result -ne "PASS" -or $py.byte_echo -ne $true -or $py.message_type -ne 1 -or $py.frame_length -ne 108) {
              throw "Python TCP byte-equality evidence failed."
            }

            Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_tcp_fallback_result.txt" -Force
            Copy-Item $pythonResult ".\build\stage07\stage07_native_tcp_python_result.json" -Force

            $evidence = [ordered]@{
              schema_version = 1
              stage = "07"
              proof_type = "KATARINA_STAGE07_NATIVE_TCP_FALLBACK"
              runner = "windows-2022"
              endpoint = "tcp://127.0.0.1:5572"
              mql_transport = "SocketCreate/SocketConnect/SocketSend/SocketRead"
              python_transport = "Kat1TcpServerTransport"
              framing = "KAT1_FRAME_LENGTH_ONLY"
              secondary_envelope = $false
              golden_message = "HELLO"
              frame_length = 108
              cross_language_byte_equality = "PASS"
              compile = "PASS_0_ERRORS_0_WARNINGS"
              ex5_sha256 = "$env:TCP_EX5_SHA256"
              live_trading_allowed = $false
              dll_import_allowed = $false
              result = "PASS_STAGE07_NATIVE_TCP_FALLBACK"
            }
            $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_native_tcp_fallback_evidence.json" -Encoding UTF8
          }
          finally {
            if (-not $peer.HasExited) { Stop-Process -Id $peer.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Run backpressure and latency profile
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python .\scripts\stage07\profile_stage07_transport.py --repo-root . --output .\build\stage07\stage07_transport_profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Get-Content ".\build\stage07\stage07_transport_profile.json" -Raw | ConvertFrom-Json
          if ($p.result -ne "PASS_STAGE07_BACKPRESSURE_LATENCY_PROFILE") {
            throw "Stage-07 profile did not pass."
          }

      - name: Run final evidence audit
        shell: pwsh
        run: |
          $tcpEvidence = Get-Content ".\build\stage07\stage07_native_tcp_fallback_evidence.json" -Raw
          $synthetic = [ordered]@{
            schema_version = 1
            receipt = [ordered]@{ exit_code = 0 }
            files = @(
              [ordered]@{
                name = "stage07_native_tcp_fallback_evidence.json"
                content_included = $true
                content = $tcpEvidence
              }
            )
          }
          $synthetic | ConvertTo-Json -Depth 12 | Set-Content ".\build\stage07\stage07_tcp_bundle.json" -Encoding UTF8

          python .\scripts\stage07\audit_stage07_final.py --repo-root . --profile-evidence .\build\stage07\stage07_transport_profile.json --tcp-bundle .\build\stage07\stage07_tcp_bundle.json --batch-bundle .\ops\vps\results\katarina-vps-2012r2-01\s7-batch-opt1\bundle.json --output .\build\stage07\stage07_final_clearance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content ".\build\stage07\stage07_final_clearance.json" -Raw | ConvertFrom-Json
          if ($audit.result -ne "PASS_STAGE07_FINAL_CLEARANCE" -or $audit.ready_for_stage08 -ne $true) {
            throw "Stage-07 final clearance failed."
          }

      - name: Upload Stage 07 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-final-clearance-evidence
          path: |
            build/stage07/KatarinaStage07TcpFallbackIntegration.compile.log
            build/stage07/stage07_mt5_allowlist_ui.json
            build/stage07/Katarina_Stage07_tcp_fallback_result.txt
            build/stage07/stage07_native_tcp_python_result.json
            build/stage07/stage07_native_tcp_fallback_evidence.json
            build/stage07/stage07_transport_profile.json
            build/stage07/stage07_final_clearance.json
          retention-days: 90
          if-no-files-found: warn
