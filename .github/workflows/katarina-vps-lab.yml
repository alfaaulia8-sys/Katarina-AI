name: Katarina VPS Lab

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Path to one ops/vps/requests/actions/*.json request"
        required: true
        type: string
  push:
    paths:
      - "ops/vps/requests/actions/*.json"

permissions:
  contents: read

jobs:
  vps-task:
    runs-on: [self-hosted, windows, x64, katarina-vps]
    timeout-minutes: 120

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $path = "${{ inputs.request_path }}"
          } else {
            $before = "${{ github.event.before }}"
            $after = "${{ github.sha }}"
            $paths = @(git diff --name-only $before $after -- "ops/vps/requests/actions/*.json")
            if ($paths.Count -ne 1) {
              throw "Expected exactly one VPS request in the triggering commit; found $($paths.Count)."
            }
            $path = $paths[0]
          }

          if ($path -notmatch '^ops/vps/requests/actions/[A-Za-z0-9._-]+\.json$') {
            throw "Invalid request path: $path"
          }
          if (!(Test-Path $path)) {
            throw "Request file not found: $path"
          }

          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Execute allowlisted VPS task
        id: execute
        continue-on-error: true
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "katarina-vps-result"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\vps\Invoke-KatarinaRemoteTask.ps1" -RequestFile "${{ steps.request.outputs.path }}" -OutputDir $out -RepoRoot $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE

      - name: Upload VPS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katarina-vps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\katarina-vps-result\
          if-no-files-found: error
          retention-days: 14

      - name: Propagate task failure
        if: steps.execute.outcome != 'success'
        shell: powershell
        run: |
          throw "Katarina VPS task failed. Inspect the uploaded artifact and job log."
