name: Katarina VPS Lab

# This workflow must never start the self-hosted VPS on repository pushes.
# Only an explicit main-branch dispatch after GitHub-hosted verification may use it.
on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Path to one pre-reviewed ops/vps/requests/actions/*.json request"
        required: true
        type: string

permissions:
  contents: read

jobs:
  vps-task:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, katarina-vps]
    timeout-minutes: 120

    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve allowlisted request path
        id: request
        shell: powershell
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          # Use an environment variable, not direct interpolation into script text.
          $path = $env:REQUEST_PATH
          if ($path -cnotmatch '^ops/vps/requests/actions/[A-Za-z0-9._-]+\.json$') {
            throw "Invalid request path."
          }
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Request file not found."
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Execute allowlisted VPS task
        id: execute
        continue-on-error: true
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "katarina-vps-result"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\vps\Invoke-KatarinaRemoteTask.ps1" -RequestFile "${{ steps.request.outputs.path }}" -OutputDir $out -RepoRoot $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE

      - name: Upload VPS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katarina-vps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\katarina-vps-result\
          if-no-files-found: error
          retention-days: 14

      - name: Propagate task failure
        if: steps.execute.outcome != 'success'
        shell: powershell
        run: |
          throw "Katarina VPS task failed. Inspect the uploaded artifact and job log."
