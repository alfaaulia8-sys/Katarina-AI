name: Stage 08 Data Validation

# Optional manual validation; main push is verified by Body CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage 08 validation tests
        shell: bash
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s tests/unit/validation -p 'test_*.py' -v 2>&1 | tee stage08-tests.txt
          grep -E "Ran [0-9]+ tests" stage08-tests.txt
          grep -E "^OK$" stage08-tests.txt

      - name: Run Stage 08 final audit
        shell: bash
        run: |
          export PYTHONPATH=src
          mkdir -p build/stage08
          python scripts/stage08/audit_stage08_final.py --repo-root . --output build/stage08/stage08_final_clearance.json
          python - <<'PY'
          import json
          with open("build/stage08/stage08_final_clearance.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["result"] == "PASS_STAGE08_FINAL_CLEARANCE"
          assert data["ready_for_stage09"] is True
          assert data["live_risk_ready"] is False
          PY

      - name: Upload Stage 08 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage08-final-clearance-evidence
          path: |
            stage08-tests.txt
            build/stage08/stage08_final_clearance.json
          retention-days: 90
